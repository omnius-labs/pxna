[profile.release]
debug = 1

[workspace]
members = [
  "./refs/core-rs/modules/base",
  "./refs/core-rs/modules/migration",
  "./refs/core-rs/modules/omnikit",
  "./refs/core-rs/modules/testkit",
  "./refs/core-rs/modules/rocketpack",
  "./refs/core-rs/modules/yamux",
  "./refs/core-rs/entrypoints/lint-style",

  "./entrypoints/daemon",
  "./modules/engine",
]
exclude = ["refs/core-rs"]
resolver = "3"

[workspace.package]
edition = "2024"
authors = ["Lyrise <lyrise1984@gmail.com>"]
license = "AGPL-3.0-only"
version = "0.1.0"

[workspace.dependencies]
omnius-pxna-engine = { path = "./modules/engine" }

omnius-core-base = { path = "./refs/core-rs/modules/base" }
omnius-core-migration = { path = "./refs/core-rs/modules/migration", features = [
  "sqlite",
] }
omnius-core-omnikit = { path = "./refs/core-rs/modules/omnikit" }
omnius-core-testkit = { path = "./refs/core-rs/modules/testkit" }
omnius-core-rocketpack = { path = "./refs/core-rs/modules/rocketpack" }
omnius-core-yamux = { path = "./refs/core-rs/modules/yamux" }

rand = { version = "0.10.1", features = ["std_rng", "sys_rng", "chacha"] }
rand_core = "0.10.1"
reqwest = { version = "0.13.4", features = ["json"] }
anyhow = { version = "1.0.101", features = ["backtrace"] }
async-trait = "0.1.89"
chrono = "0.4.44"
glob = "0.3.4"
jiff = { version = "0.2.35", features = ["tzdb-bundle-always"] }
regex = "1"
serde = { version = "1.0.228", features = ["derive", "rc"] }
serde_json = "1.0.150"
testcontainers = "0.28.0"
tokio = { version = "1.52.3", features = ["full"] }
tokio-util = { version = "0.7.18", features = ["full"] }
tokio-stream = "0.1.18"
tokio-postgres = { version = "0.7.17", features = ["with-chrono-0_4"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
unicode-normalization = "0.1.25"
uuid = { version = "1.23.2", features = ["serde", "v4"] }
sqlx = { version = "0.9.0", features = [
  "sqlite",
  "chrono",
  "json",
  "macros",
  "runtime-tokio",
  "tls-rustls",
] }
tower-http = { version = "0.6.11", features = ["cors", "fs"] }
utoipa = { version = "5.5.0", features = ["yaml"] }
utoipa-swagger-ui = { version = "9.0.2", features = ["axum"] }
ring = "0.17.14"
hex = "0.4.3"
urlencoding = "2.1.3"
hyper = "1.10.1"
tower = "0.5.3"
thiserror = "2.0.18"
jsonwebtoken = "10.4.0"
validator = { version = "0.20.0", features = ["derive"] }
once_cell = "1.21.4"
base64 = "0.22.1"
futures = "0.3.32"
futures-util = "0.3.32"
serial_test = "3.4.0"
rupnp = "3.0.0"
pin-utils = "0.1.0"
local-ip-address = "0.6.13"
nom = "8.0.0"
fast-socks5 = "1.0.0"
sha3 = "0.12.0"
argon2 = "0.6.0"
blake3 = "1.8.7"
ciborium = "0.2.2"
tempfile = "3.27.0"
filetime = "0.2.25"
crc = "3.4.0"
testresult = "0.4.1"
p256 = { version = "0.13.2", features = ["ecdh"] }
hkdf = "0.13.0"
hmac = "0.13.0"
aes-gcm = "0.10.3"
parking_lot = "0.12.5"
clap = { version = "4.6.1", features = ["wrap_help", "derive"] }
x25519-dalek = { version = "=3.0.0", features = ["static_secrets"] }
ed25519-dalek = { version = "=3.0.0", features = [
  "alloc",
  "rand_core",
  "serde",
  "pkcs8",
] }
yamux = "0.14.1"
toml = "1.0.1"
backtrace = "0.3.76"
async-stream = "0.3.6"
image = { version = "0.25.9", default-features = false, features = ["bmp", "dds", "exr", "ff", "gif", "hdr", "ico", "jpeg", "png", "pnm", "qoi", "tga", "tiff", "webp"] }
libwebp-sys = "0.14.4"
fast_image_resize = { version = "6.1.0", features = ["image"] }
kamadak-exif = "0.6.1"
async_zip = { version = "0.0.19", features = ["full"] }
sevenz-rust2 = "0.22.0"
encoding_rs = "0.8.35"
mockall = "0.14.0"
syn = { version = "3.0.6", features = ["full"] }
proc-macro2 = { version = "1.0.104", features = ["span-locations"] }
walkdir = "2.5.0"
strum = { version = "0.28.0", features = ["derive"] }
enumflags2 = "0.7.12"
rustix = { version = "1.1.4", features = ["fs", "process"] }
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  "Win32_System_Threading",
] }

axum = { version = "0.8", features = ["multipart", "ws"] }
axum-extra = { version = "0.12", features = [
  "cookie",
  "query",
  "typed-header",
] }
bytes = "1"
jsonschema = { version = "0.60", default-features = false }
tokio-tungstenite = "0.30"
headers = "0.4"
http = "1"
