openapi: 3.0.3
info:
    title: Pxna
    version: 0.3.0
    description: |
        Pxna daemon API for authenticated remote file browsing and
        management.

        The first registered user becomes the single owner for the Pxna
        instance. Public setup is disabled after that user is created.

        Browser clients use an HttpOnly session cookie. Native clients use the same server-side session through an opaque Bearer token.
        File APIs behave identically for both authentication transports.

        File paths are always relative to a daemon-configured Library. The
        API never accepts arbitrary host filesystem roots from clients.

        A path inside an archive is written by plain concatenation, as in
        `/photos/a.zip/dir/x.png`. `RelativePath` has no archive separator
        and its grammar does not change. The daemon locates the boundary by
        probing the filesystem, which is unambiguous because a file and a
        directory cannot share a name in one directory. An archive's root is
        addressed by `view=folder` rather than a trailing slash; without it,
        `/photos/a.zip` is the zip file itself.

        Mutations follow one rule set. A write to one Entry responds when it
        is done. Copy, move, delete, and timeline scans always answer `202`
        with an Operation, which is polled through the Operations API until
        it is terminal, unless it already is. Copy, move, and upload share a
        `conflict` policy that defaults to `fail`, so nothing is overwritten
        unless a client explicitly asks for it. Mutations are rejected with
        `403` both for paths inside archives and for Libraries marked
        `readonly`.
    license:
        name: MIT

servers:
    - url: http://localhost:6050/api/v1
      description: Local development daemon

tags:
    - name: Meta
      description: The daemon's liveness, the optional features it implements, and whether its owner is registered.
    - name: Auth
      description: Registering the owner, password login, and reading and revoking the current session.
    - name: Libraries
      description: Libraries available to the current user.
    - name: Entries
      description: |
        The Entries of a Scope of starts in one or more Libraries read through a Filter, the metadata of several Entries, copying,
        moving, and deleting Entries, and one Entry addressed by its Library and path: its metadata, its content, file and folder
        creation, and the probe for its children.
    - name: Uploads
      description: Resumable chunked upload sessions.
    - name: Operations
      description: Progress and results of copies, moves, deletions, and timeline scans.
    - name: Timeline
      description: The state of the timeline's aggregation of Libraries, and starting it.
    - name: Media
      description: |
        Media information of an image or video, the WebSocket through which clients receive thumbnails, sprite sheets, and display
        images, and authenticated HLS playback sessions.
    - name: Ratings & Tags
      description: The current user's rating and tags of an image or video, and the words the user has created.
    - name: Shelves
      description: The current user's Shelves and folder settings, which every client reads and edits.
    - name: Preferences
      description: Display preferences the owner saves on the server.
    - name: Performance
      description: Client-side timings written to the daemon's performance log.

security:
    - cookieAuth: []
    - bearerAuth: []

paths:
    /health:
        get:
            tags:
                - Meta
            summary: Check daemon health
            operationId: getHealth
            security: []
            responses:
                "200":
                    description: The daemon is running.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/HealthResponse"
                            example:
                                result: true
                "500":
                    $ref: "#/components/responses/InternalServerError"

    /setup/status:
        get:
            tags:
                - Meta
            summary: Get initial setup status
            description: Checks whether the owner has already been registered.
            operationId: getSetupStatus
            security: []
            responses:
                "200":
                    description: Current setup status.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/SetupStatus"
                            examples:
                                uninitialized:
                                    value:
                                        initialized: false
                                initialized:
                                    value:
                                        initialized: true
                "500":
                    $ref: "#/components/responses/InternalServerError"

    /setup:
        post:
            tags:
                - Auth
            summary: Register the initial owner
            description: |
                Creates the only owner and an authenticated session. This operation
                is available only while no user exists. The check and user creation must
                be performed atomically so concurrent requests cannot create two owners.

                With `sessionTransport=cookie`, the session is returned through
                `Set-Cookie` and `accessToken` is omitted. With
                `sessionTransport=bearer`, the opaque token is returned as
                `accessToken` for storage in the native client's secure credential store.
            operationId: createInitialSetup
            security: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/InitialSetupRequest"
            responses:
                "201":
                    description: Owner and authenticated session created.
                    headers:
                        Set-Cookie:
                            $ref: "#/components/headers/SessionCookie"
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/AuthResult"
                "400":
                    $ref: "#/components/responses/InvalidRequest"
                "409":
                    $ref: "#/components/responses/AlreadyInitialized"
                "500":
                    $ref: "#/components/responses/InternalServerError"

    /auth/login:
        post:
            tags:
                - Auth
            summary: Log in with username and password
            description: |
                Creates a server-side session after password verification.

                Browser clients request `cookie`; native clients request `bearer`.
                Both transports create the same kind of revocable server-side session.
                No refresh token or JWT is used.
            operationId: login
            security: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/LoginRequest"
            responses:
                "200":
                    description: Login succeeded.
                    headers:
                        Set-Cookie:
                            $ref: "#/components/headers/SessionCookie"
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/AuthResult"
                "400":
                    $ref: "#/components/responses/InvalidRequest"
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "500":
                    $ref: "#/components/responses/InternalServerError"

    /auth/session:
        get:
            tags:
                - Auth
            summary: Get the current user and session
            operationId: getCurrentSession
            responses:
                "200":
                    description: Current authenticated user and session.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/CurrentAuth"
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "500":
                    $ref: "#/components/responses/InternalServerError"
        delete:
            tags:
                - Auth
            summary: Revoke the current session
            description: |
                Revokes the server-side session. Cookie clients also receive an expired
                session cookie. Native clients must delete the token from a secure
                credential store after this request succeeds.
            operationId: deleteCurrentSession
            responses:
                "204":
                    description: Session revoked.
                    headers:
                        Set-Cookie:
                            $ref: "#/components/headers/ClearedSessionCookie"
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "500":
                    $ref: "#/components/responses/InternalServerError"

    /preferences:
        get:
            tags:
                - Preferences
            summary: Get the display preferences
            description: |
                Returns the saved display preferences. When nothing has been
                saved yet, the server returns the default values.
            operationId: getPreferences
            responses:
                "200":
                    description: Display preferences.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Preferences"
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "500":
                    $ref: "#/components/responses/InternalServerError"
        put:
            tags:
                - Preferences
            summary: Replace the display preferences
            description: |
                Replaces all display preferences with the given values. The
                server validates the ranges and keeps the saved values when
                any value is out of range. The ranges are part of this
                contract, so a value out of range is rejected with 400 before
                the handler runs.
            operationId: putPreferences
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/Preferences"
            responses:
                "200":
                    description: The saved display preferences.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Preferences"
                "400":
                    $ref: "#/components/responses/InvalidRequest"
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "500":
                    $ref: "#/components/responses/InternalServerError"

    /shelves:
        get:
            tags:
                - Shelves
            summary: List the Shelves
            description: |
                Returns the current user's Shelves in their order. The first read of a
                user while a Library is configured creates the default Shelf Timeline,
                which is not created again once it is deleted. It starts at the roots of
                the Libraries in `timelineLibraries` of the display preferences, or of
                every Library when none of them is configured, at most 64. A user
                who already has 200 Shelves gets it at a later read, once there is
                room.
            operationId: listShelves
            responses:
                "200":
                    description: The Shelves.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ShelfList"
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "500":
                    $ref: "#/components/responses/InternalServerError"
        post:
            tags:
                - Shelves
            summary: Create a Shelf
            description: |
                Creates a Shelf and puts it last. The Scope and the Filter are checked as
                the body of `listEntryMonths` is, and the starts for form only, so a
                start may name nothing. A user has at most 200 Shelves.
            operationId: createShelf
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/ShelfInput"
            responses:
                "201":
                    description: The created Shelf.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Shelf"
                "400":
                    $ref: "#/components/responses/InvalidRequest"
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "500":
                    $ref: "#/components/responses/InternalServerError"

    /shelves/order:
        put:
            tags:
                - Shelves
            summary: Reorder the Shelves
            description: |
                Orders the Shelves as given. `ids` names every Shelf of the user exactly
                once, and any other list is refused.
            operationId: reorderShelves
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/ShelfOrder"
            responses:
                "200":
                    description: The Shelves in the new order.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ShelfList"
                "400":
                    $ref: "#/components/responses/InvalidRequest"
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "500":
                    $ref: "#/components/responses/InternalServerError"

    /shelves/{shelfId}:
        put:
            tags:
                - Shelves
            summary: Replace a Shelf
            description: |
                Replaces a Shelf whole, keeping its id and position, with the checks of
                `createShelf`.
            operationId: replaceShelf
            parameters:
                - $ref: "#/components/parameters/ShelfIdPath"
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/ShelfInput"
            responses:
                "200":
                    description: The saved Shelf.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Shelf"
                "400":
                    $ref: "#/components/responses/InvalidRequest"
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "404":
                    $ref: "#/components/responses/NotFound"
                "500":
                    $ref: "#/components/responses/InternalServerError"
        delete:
            tags:
                - Shelves
            summary: Delete a Shelf
            operationId: deleteShelf
            parameters:
                - $ref: "#/components/parameters/ShelfIdPath"
            responses:
                "204":
                    description: The Shelf was deleted.
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "404":
                    $ref: "#/components/responses/NotFound"
                "500":
                    $ref: "#/components/responses/InternalServerError"

    /folder-settings:
        get:
            tags:
                - Shelves
            summary: List the folder settings
            description: |
                Returns the display values the current user saved for folders. A client
                resolves the values of a folder itself.
            operationId: listFolderSettings
            responses:
                "200":
                    description: The folder settings.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/FolderSettingList"
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "500":
                    $ref: "#/components/responses/InternalServerError"

    /timeline/status:
        get:
            tags:
                - Timeline
            summary: Get the state of the timeline scans
            description: Returns the state of the scan of each given Library, in the given order.
            operationId: getTimelineStatus
            parameters:
                - $ref: "#/components/parameters/TimelineLibraryIdsQuery"
            responses:
                "200":
                    description: State of the scans.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/TimelineStatuses"
                "400":
                    $ref: "#/components/responses/InvalidRequest"
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "404":
                    $ref: "#/components/responses/NotFound"
                "500":
                    $ref: "#/components/responses/InternalServerError"

    /timeline/scans:
        post:
            tags:
                - Timeline
            summary: Start timeline scans
            description: |
                Starts aggregation of each given whole Library and answers one
                Operation of kind `timelineScan` per Library, in request order.
                A Library whose aggregation is already running joins it: the
                Operation follows that scan, and a request while a requested
                scan runs answers the same Operation. `processedCount` counts
                the files and archive entries the scan has processed. A scan
                runs to its end; cancelling its Operation answers the current
                state and stops nothing. An unknown Library starts no scan.
            operationId: startTimelineScans
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/TimelineScanRequest"
            responses:
                "202":
                    description: One Operation per Library.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/OperationList"
                "400":
                    $ref: "#/components/responses/InvalidRequest"
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "404":
                    $ref: "#/components/responses/NotFound"
                "500":
                    $ref: "#/components/responses/InternalServerError"
    /libraries:
        get:
            tags:
                - Libraries
            summary: List available Libraries
            description: |
                Returns the daemon-configured libraries owned by the current
                owner. Physical host paths are not exposed.
            operationId: listLibraries
            responses:
                "200":
                    description: Available Libraries.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/LibraryList"
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "500":
                    $ref: "#/components/responses/InternalServerError"

    /libraries/{libraryId}:
        get:
            tags:
                - Libraries
            summary: Get a Library
            operationId: getLibrary
            parameters:
                - $ref: "#/components/parameters/LibraryIdPath"
            responses:
                "200":
                    description: Library metadata.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/LibraryResponse"
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "403":
                    $ref: "#/components/responses/Forbidden"
                "404":
                    $ref: "#/components/responses/NotFound"
                "500":
                    $ref: "#/components/responses/InternalServerError"

    /entries:
        post:
            tags:
                - Entries
            summary: List the Entries of a Scope
            description: |
                Lists the Entries of a Scope, the `starts` of `scope` with its
                `recursive` and `insideArchives`, through a `filter` of `query`,
                `rating`, `tags`, and `kinds`, as one sequence ordered by
                `sort`, `order`, and `options.foldersFirst`, and returns them as
                one Entry page. Each item comes with its Library id. Entries that
                compare equal, which only happens for the same path in
                different Libraries, follow the order of the starts. It is the
                only listing: a folder, the tree, a search, the timeline, a
                Shelf, and the summary of a folder's direct children are each a
                Scope and a Filter. The request is a POST because it carries a
                body; it changes nothing.

                A start is a `LibraryPath`: a Library id and a path relative to
                the Library with its leading `/` (`/` for the root), read as a
                folder, so an archive is its root. A start whose Library id is
                not of the form of a configured one, or whose path is not a
                Library-relative path, is 400. A start that another start covers
                adds nothing, the same start given twice included. A start
                inside an archive is covered by a recursive start above it only
                with `insideArchives`.

                A start whose folder was deleted, whose Library is not
                configured, or that names a file that is neither a folder nor an
                archive is skipped and named in `warnings.missingStarts`, with
                the path it was given; the other starts are listed. A start that
                is an archive, or inside one, is walked inside that archive, and
                reads the archives nested in it only with `insideArchives`.

                A recursive listing without `kinds` returns no folder, and, with
                `insideArchives`, none of the archives it reads like folders. A
                start that is walked because the name index of its Library is not
                usable returns its archives like other files and is named in
                `warnings.walkedStarts`. With `kinds` it returns exactly the
                named kinds, symbolic links counted as `other`. A listing of
                direct children without `kinds` returns every kind. Hidden
                entries, whose names start with `.`, and the entries inside them
                are returned only with `options.includeHidden`; a recursive
                listing that reads them walks the file system, because the name
                index holds none.

                `rating` and `tags` keep only the images and videos that the
                current user has rated or tagged that way. While one of them is
                set, `page.snapshot` also changes whenever the user rates or
                tags anything.

                Recursive traversal is cut off per start at the configured entry
                limit, and the starts cut off are listed in
                `warnings.cutOffStarts`.

                `page.kind` is `offset` for every sort except `timeline_date`,
                and `cursor` with it; the other kind is 400. An `offset` page is
                cut from a snapshot at `page.offset`, or, with `page.locate`,
                which names an Entry as a start is named, at the page that holds
                it; `locate` together with `offset` is 400, and an Entry that is
                not in the sequence is 404. The response page carries
                `offset`, `totalCount`, and `snapshot`.

                `options.fields` of `summary` reads the direct children of one
                start in `name` or `kind` order and returns `summaries`, each
                with the path, name, kind, and archive hint, in place of
                `items`; the details are read with `listEntryMetadata`. A
                summary with `recursive`, with more than one start, or with
                another sort is 400. Otherwise the page carries `items`.

                With `sort` of `timeline_date` the Entries are the images and
                videos of the Scope, newest timeline date first, and those with
                the same timeline date are ordered by Library id and then by
                path. `kinds` may name only `image` and `video`, and names both
                when it is absent; any other kind is 400. At most one of
                `page.after`, `page.before`, `page.month`, and `page.around`
                selects where the page starts, and without any of them it starts
                at the newest Entry. The response page carries `previous` and
                `next`, cursors for the pages before and after the returned
                Entries, absent when there is nothing further in that
                direction; a cursor is only meaningful with the same Scope and
                Filter. `order` may be `desc` only, and `options.foldersFirst`
                and `options.includeHidden` are 400.

                Without a name, rating, or tag condition the Entries come from
                the timeline index that the daemon builds in the background,
                as of the last aggregation, and a start that is an archive, or
                inside one, returns every row under it, the Entries of the
                archives nested in it included. With one, the Entries are the
                matches of each start, which carry the attributes read from the
                file system, and the starts cut off and walked are named as
                above; a match that has no timeline date yet is not returned.
            operationId: listEntries
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/EntryListRequest"
            responses:
                "200":
                    description: The Entries of the Scope.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/EntryPage"
                "400":
                    $ref: "#/components/responses/InvalidRequest"
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "403":
                    $ref: "#/components/responses/Forbidden"
                "404":
                    $ref: "#/components/responses/NotFound"
                "500":
                    $ref: "#/components/responses/InternalServerError"
                "504":
                    $ref: "#/components/responses/GatewayTimeout"

    /entries/months:
        post:
            tags:
                - Entries
            summary: List the months that have Entries of a Scope
            description: |
                Returns the number of images and videos of a Scope through a
                Filter in each month of their timeline dates, newest month
                first, without the months that have none. Each count equals the
                number of Entries that `listEntries` with `sort` of
                `timeline_date` returns for that month with the same `scope`
                and `filter`. For whole Libraries without a name, rating, or tag
                condition the counts are sums held in advance; otherwise they
                are counted from the Entries of the Scope on each request.
                `kinds` may name only `image` and `video`; any other kind is
                400. The starts cut off, walked, and missing are named by
                `listEntries` alone. The request is a POST because it carries a
                body; it changes nothing.
            operationId: listEntryMonths
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/EntryMonthsRequest"
            responses:
                "200":
                    description: Entry counts per month.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/TimelineMonths"
                "400":
                    $ref: "#/components/responses/InvalidRequest"
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "403":
                    $ref: "#/components/responses/Forbidden"
                "404":
                    $ref: "#/components/responses/NotFound"
                "500":
                    $ref: "#/components/responses/InternalServerError"
                "504":
                    $ref: "#/components/responses/GatewayTimeout"

    /entries/metadata:
        post:
            tags:
                - Entries
            summary: Read the metadata of up to 200 Entries
            description: |
                Read-only metadata request over places in one or more Libraries,
                each a Library id and a Library-relative path. Validates every
                place and rejects duplicates after normalization before
                resolving any of them. Returns one result per place in request
                order, with its Library id and normalized path, and either
                `detail`, the Entry as a listing shows it, or `error`, the error
                kind of that place.
                The failure of one place does not discard the others. At most
                four places are resolved at the same time across all requests
                and Libraries. The leaf is inspected without following a
                symbolic link, as in a listing. The request is a POST because it
                carries a body; it changes nothing.
            operationId: listEntryMetadata
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/EntryMetadataRequest"
            responses:
                "200":
                    description: Exactly one Entry or error kind per place.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/EntryMetadataList"
                "400":
                    $ref: "#/components/responses/InvalidRequest"
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "403":
                    $ref: "#/components/responses/Forbidden"
                "500":
                    $ref: "#/components/responses/InternalServerError"

    /entries/copy:
        post:
            tags:
                - Entries
            summary: Copy Entries
            description: |
                Copies 1 to 1,000 Entries of one Library into a destination
                folder, keeping each name, or one Entry to an exact path. A
                source with `view=folder` is a folder or an archive's root,
                whose contents are copied; any other source is a file, an
                archive file included. Files and folders may be mixed.
                `conflict` resolves each name that exists at the destination.
                The checks made before the work starts answer their own
                status; after that the response is always `202` with the
                Operation, and the failure of one entry does not discard the
                others. The Operation runs in the background.

            operationId: copyEntries
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/EntryTransferRequest"
            responses:
                "202":
                    description: The Operation, terminal when the work finished before the response.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/OperationResponse"
                "400":
                    $ref: "#/components/responses/InvalidRequest"
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "403":
                    $ref: "#/components/responses/Forbidden"
                "404":
                    $ref: "#/components/responses/NotFound"
                "409":
                    $ref: "#/components/responses/Conflict"
                "500":
                    $ref: "#/components/responses/InternalServerError"

    /entries/move:
        post:
            tags:
                - Entries
            summary: Move or rename Entries
            description: |
                Moves 1 to 1,000 Entries of one Library into a destination
                folder, keeping each name, or one Entry to an exact path. A
                source with `view=folder` is a folder or an archive's root,
                whose contents are moved; any other source is a file, an
                archive file included. Files and folders may be mixed.
                `conflict` resolves each name that exists at the destination.
                The checks made before the work starts answer their own
                status; after that the response is always `202` with the
                Operation, and the failure of one entry does not discard the
                others. A rename is a move of one
                source to an exact path. One source moving within its Library
                is a metadata-only rename that finishes before the response,
                so the Operation is already terminal; a move across Libraries
                copies and then deletes the source.

            operationId: moveEntries
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/EntryTransferRequest"
            responses:
                "202":
                    description: The Operation, terminal when the work finished before the response.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/OperationResponse"
                "400":
                    $ref: "#/components/responses/InvalidRequest"
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "403":
                    $ref: "#/components/responses/Forbidden"
                "404":
                    $ref: "#/components/responses/NotFound"
                "409":
                    $ref: "#/components/responses/Conflict"
                "500":
                    $ref: "#/components/responses/InternalServerError"

    /entries/delete:
        post:
            tags:
                - Entries
            summary: Delete Entries
            description: |
                Permanently deletes 1 to 1,000 Entries of one Library; there is
                no trash. A folder target (`view=folder`) that is not empty needs
                `recursive=true`. A target in a readonly Library or inside an
                archive, an archive's root included, is `403`; an archive file
                itself is deleted as a file. The checks made before the work
                starts answer their own status; after that the response is
                always `202` with the Operation, which is already terminal when
                one file or only folders without `recursive` were deleted.
            operationId: deleteEntries
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/EntryDeleteRequest"
            responses:
                "202":
                    description: The Operation, terminal when the work finished before the response.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/OperationResponse"
                "400":
                    $ref: "#/components/responses/InvalidRequest"
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "403":
                    $ref: "#/components/responses/Forbidden"
                "404":
                    $ref: "#/components/responses/NotFound"
                "409":
                    $ref: "#/components/responses/Conflict"
                "500":
                    $ref: "#/components/responses/InternalServerError"

    /capabilities:
        get:
            tags:
                - Meta
            summary: Get optional browsing capabilities
            operationId: getCapabilities
            description: |
                Authenticated feature discovery. A client falls back to the
                original detailed listing when this endpoint is absent or a
                required capability is false. Errors on an existing feature
                endpoint are not interpreted as absence of that feature.
            responses:
                "200":
                    description: Optional browsing features implemented by this daemon.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Capabilities"
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "500":
                    $ref: "#/components/responses/InternalServerError"

    /performance/client-timings:
        post:
            tags:
                - Performance
            summary: Record client-side timings
            description: |
                Writes the timings a client measured to the daemon's
                performance log, next to the daemon's own measurements. A
                client sends them only while `performanceLogging` of
                `/capabilities` is true. While it is false, the daemon
                accepts and discards them.
            operationId: reportClientTimings
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/ClientTimingReport"
            responses:
                "204":
                    description: The timings were accepted.
                "400":
                    $ref: "#/components/responses/InvalidRequest"
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "500":
                    $ref: "#/components/responses/InternalServerError"

    /sockets/image:
        get:
            tags:
                - Media
            summary: Open the image socket
            description: |
                Upgrades the connection to a WebSocket, through which the
                client wants thumbnails, sprite sheets, and display images and
                receives them. Every message and binary frame is defined by
                `sockets/image.schema.json` in this directory; this entry
                names only the upgrade.

                The upgrade carries the session cookie or a Bearer token like
                any other request. When it carries the session cookie, its
                `Origin` must match its `Host`, as for a mutation, and `403`
                is returned otherwise, also when `Origin` is missing. A session
                may keep a limited number of sockets open, and `429` is
                returned beyond it.

                The daemon closes the socket with code `4401` when the
                session ends, `4400` when the client breaks the contract or a
                limit, and `1001` when it shuts down.
            operationId: getImageSocket
            responses:
                "101":
                    description: The connection is upgraded to a WebSocket.
                "400":
                    $ref: "#/components/responses/InvalidRequest"
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "403":
                    $ref: "#/components/responses/Forbidden"
                "429":
                    description: The session already has the most image sockets it may keep open. `code` is `LimitExceeded`.
                    content:
                        application/problem+json:
                            schema:
                                $ref: "#/components/schemas/Problem"
                "500":
                    $ref: "#/components/responses/InternalServerError"

    /libraries/{libraryId}/entries/metadata:
        get:
            tags:
                - Entries
            summary: Get the metadata of an Entry
            description: |
                Returns one Entry. `view` chooses the face of an archive: `file`
                is the archive file, and `folder` is its root. Without `view`, a
                folder is read as a folder and every file, an archive included,
                as a file. `view=file` on a folder and `view=folder` on a file
                that is not an archive are `400`.
            operationId: getEntryMetadata
            parameters:
                - $ref: "#/components/parameters/LibraryIdPath"
                - $ref: "#/components/parameters/PathQuery"
                - $ref: "#/components/parameters/ViewQuery"
            responses:
                "200":
                    description: The Entry.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/EntryResponse"
                "400":
                    $ref: "#/components/responses/InvalidRequest"
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "403":
                    $ref: "#/components/responses/Forbidden"
                "404":
                    $ref: "#/components/responses/NotFound"
                "409":
                    $ref: "#/components/responses/Conflict"
                "500":
                    $ref: "#/components/responses/InternalServerError"
                "504":
                    $ref: "#/components/responses/GatewayTimeout"

    /libraries/{libraryId}/entries/content:
        get:
            tags:
                - Entries
            summary: Read file content
            description: |
                Streams raw file bytes. Clients may use either HTTP `Range` or the
                explicit `offset` and `limit` query parameters. If both are provided,
                `Range` takes precedence. With neither `offset` nor `limit`, the whole
                file is streamed. With `offset` alone, the window is 1 MiB.
            operationId: readFileContent
            parameters:
                - $ref: "#/components/parameters/LibraryIdPath"
                - $ref: "#/components/parameters/PathQuery"
                - $ref: "#/components/parameters/RangeHeader"
                - $ref: "#/components/parameters/OffsetQuery"
                - $ref: "#/components/parameters/ReadLimitQuery"
            responses:
                "200":
                    description: Full or requested file bytes.
                    headers:
                        Accept-Ranges:
                            $ref: "#/components/headers/AcceptRanges"
                        Content-Length:
                            $ref: "#/components/headers/ContentLength"
                        ETag:
                            $ref: "#/components/headers/ETag"
                    content:
                        application/octet-stream:
                            schema:
                                type: string
                                format: binary
                "206":
                    description: Partial file bytes.
                    headers:
                        Accept-Ranges:
                            $ref: "#/components/headers/AcceptRanges"
                        Content-Range:
                            $ref: "#/components/headers/ContentRange"
                        Content-Length:
                            $ref: "#/components/headers/ContentLength"
                        ETag:
                            $ref: "#/components/headers/ETag"
                    content:
                        application/octet-stream:
                            schema:
                                type: string
                                format: binary
                "400":
                    $ref: "#/components/responses/InvalidRequest"
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "403":
                    $ref: "#/components/responses/Forbidden"
                "404":
                    $ref: "#/components/responses/NotFound"
                "409":
                    $ref: "#/components/responses/Conflict"
                "416":
                    $ref: "#/components/responses/RangeNotSatisfiable"
                "500":
                    $ref: "#/components/responses/InternalServerError"
                "504":
                    $ref: "#/components/responses/GatewayTimeout"
        put:
            tags:
                - Entries
            summary: Write file content in one request
            description: |
                Writes a whole file from the raw request body. The bytes are
                staged as a hidden `.pxna-tmp-*` file in the target's own
                directory and renamed into place atomically, so a failed
                request never leaves a partial file at the target path.
                Staging next to the target keeps the rename inside one
                filesystem even when the Library spans mounts.
                `conflict` is `fail`, `skip`, or `overwrite`; a write that may
                publish under another name is `POST .../entries/files`.
                Bodies larger than 32 MiB are rejected with `413`; use an
                upload session for those.
            operationId: writeFileContent
            parameters:
                - $ref: "#/components/parameters/LibraryIdPath"
                - $ref: "#/components/parameters/PathQuery"
                - $ref: "#/components/parameters/WriteConflictQuery"
            requestBody:
                required: true
                content:
                    application/octet-stream:
                        schema:
                            type: string
                            format: binary
            responses:
                "201":
                    description: File written.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/EntryResponse"
                "400":
                    $ref: "#/components/responses/InvalidRequest"
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "403":
                    $ref: "#/components/responses/Forbidden"
                "404":
                    $ref: "#/components/responses/NotFound"
                "409":
                    $ref: "#/components/responses/Conflict"
                "413":
                    $ref: "#/components/responses/PayloadTooLarge"
                "500":
                    $ref: "#/components/responses/InternalServerError"
                "507":
                    $ref: "#/components/responses/InsufficientStorage"

    /libraries/{libraryId}/entries/files:
        post:
            tags:
                - Entries
            summary: Create a file under a name the daemon may choose
            description: |
                Writes a whole file from the raw request body under `path`, or,
                when an entry already exists there, under another name the
                daemon chooses, and returns the published Entry. It is the
                creation counterpart of `PUT .../entries/content`, which writes
                to the exact path. The staging, the atomic publication, and the
                32 MiB limit are the same.
            operationId: createFile
            parameters:
                - $ref: "#/components/parameters/LibraryIdPath"
                - $ref: "#/components/parameters/PathQuery"
            requestBody:
                required: true
                content:
                    application/octet-stream:
                        schema:
                            type: string
                            format: binary
            responses:
                "201":
                    description: File created.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/EntryResponse"
                "400":
                    $ref: "#/components/responses/InvalidRequest"
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "403":
                    $ref: "#/components/responses/Forbidden"
                "404":
                    $ref: "#/components/responses/NotFound"
                "409":
                    $ref: "#/components/responses/Conflict"
                "413":
                    $ref: "#/components/responses/PayloadTooLarge"
                "500":
                    $ref: "#/components/responses/InternalServerError"
                "507":
                    $ref: "#/components/responses/InsufficientStorage"

    /libraries/{libraryId}/entries/folders:
        post:
            tags:
                - Entries
            summary: Create a folder
            description: |
                Creates a new folder. With `createParents=true`, missing
                intermediate folders are created as well. An entry already
                existing at `path` returns `409`; a missing parent with
                `createParents=false` returns `404`.
            operationId: createFolder
            parameters:
                - $ref: "#/components/parameters/LibraryIdPath"
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/CreateFolderRequest"
            responses:
                "201":
                    description: Folder created.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/EntryResponse"
                "400":
                    $ref: "#/components/responses/InvalidRequest"
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "403":
                    $ref: "#/components/responses/Forbidden"
                "404":
                    $ref: "#/components/responses/NotFound"
                "409":
                    $ref: "#/components/responses/Conflict"
                "500":
                    $ref: "#/components/responses/InternalServerError"

    /libraries/{libraryId}/entries/child-probe:
        get:
            tags:
                - Entries
            summary: Probe whether a folder has a folder-like direct child
            operationId: probeFolderChildren
            description: |
                A tri-state hint, independent of loading the child listing.
                Counts directories and archive hints, not symlink targets.
                After authentication and path validation, the probe includes
                boundary checks and worker waiting in a 50 ms response budget,
                examines at most 128 entries, and stops at the first match.
                Returns null when busy, incomplete or interrupted. False is
                returned only after reaching EOF without a matching child.
                Does not open or extract a new archive just for this probe.
                A timed-out blocking call retains its work slot until it exits.
            parameters:
                - $ref: "#/components/parameters/LibraryIdPath"
                - $ref: "#/components/parameters/PathQuery"
                - $ref: "#/components/parameters/IncludeHiddenQuery"
            responses:
                "200":
                    description: True, confirmed false, or unknown (null).
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/FolderChildrenProbe"
                "400":
                    $ref: "#/components/responses/InvalidRequest"
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "403":
                    $ref: "#/components/responses/Forbidden"
                "404":
                    $ref: "#/components/responses/NotFound"
                "500":
                    $ref: "#/components/responses/InternalServerError"
                "501":
                    description: Child probes are not provided; childProbes is false. No response body.

    /libraries/{libraryId}/entries/media:
        get:
            tags:
                - Media
            summary: Inspect media information
            operationId: getMediaInfo
            parameters:
                - $ref: "#/components/parameters/LibraryIdPath"
                - $ref: "#/components/parameters/PathQuery"
            responses:
                "200":
                    description: Media information of an image or a video.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/MediaInfoResponse"
                "400":
                    $ref: "#/components/responses/InvalidRequest"
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "403":
                    $ref: "#/components/responses/Forbidden"
                "404":
                    $ref: "#/components/responses/NotFound"
                "409":
                    $ref: "#/components/responses/Conflict"
                "500":
                    $ref: "#/components/responses/InternalServerError"
                "504":
                    $ref: "#/components/responses/GatewayTimeout"

    /libraries/{libraryId}/entries/rating:
        get:
            tags:
                - Ratings & Tags
            summary: Get the rating of an image or video
            description: |
                Returns the current user's rating. `none` means the entry has not
                been rated. Ratings are kept per user, so another user's rating
                never appears here. Reading works the same for a `readonly`
                Library.
            operationId: getRating
            parameters:
                - $ref: "#/components/parameters/LibraryIdPath"
                - $ref: "#/components/parameters/PathQuery"
            responses:
                "200":
                    description: The rating.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/RatingResponse"
                "400":
                    $ref: "#/components/responses/InvalidRequest"
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "404":
                    $ref: "#/components/responses/NotFound"
                "500":
                    $ref: "#/components/responses/InternalServerError"
                "504":
                    $ref: "#/components/responses/GatewayTimeout"
        put:
            tags:
                - Ratings & Tags
            summary: Set the rating of an image or video
            description: |
                Replaces the current user's rating. `none` clears it. The rating
                is stored by the daemon, not on the entry, so it is accepted for a
                `readonly` Library and for a path inside an archive, and the
                entry itself is never changed. Only images and videos can be
                rated; other files are rejected with `400`.
            operationId: putRating
            parameters:
                - $ref: "#/components/parameters/LibraryIdPath"
                - $ref: "#/components/parameters/PathQuery"
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/PutRatingRequest"
            responses:
                "200":
                    description: The saved rating.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/RatingResponse"
                "400":
                    $ref: "#/components/responses/InvalidRequest"
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "404":
                    $ref: "#/components/responses/NotFound"
                "500":
                    $ref: "#/components/responses/InternalServerError"
                "504":
                    $ref: "#/components/responses/GatewayTimeout"

    /libraries/{libraryId}/entries/tags:
        get:
            tags:
                - Ratings & Tags
            summary: Get the tags of an image or video
            description: |
                Returns the current user's tags on the entry, sorted by word.
                Tags are kept per user. Reading works the same for a `readonly`
                Library.
            operationId: getEntryTags
            parameters:
                - $ref: "#/components/parameters/LibraryIdPath"
                - $ref: "#/components/parameters/PathQuery"
            responses:
                "200":
                    description: The tags.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/EntryTagsResponse"
                "400":
                    $ref: "#/components/responses/InvalidRequest"
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "404":
                    $ref: "#/components/responses/NotFound"
                "500":
                    $ref: "#/components/responses/InternalServerError"
                "504":
                    $ref: "#/components/responses/GatewayTimeout"
        put:
            tags:
                - Ratings & Tags
            summary: Replace the tags of an image or video
            description: |
                Replaces the current user's tags on the entry with the given set.
                Words are trimmed and duplicates are dropped; a word the user has
                not used before is created. An invalid word or too many tags is
                rejected with `400` and nothing is changed. Like a rating, tags
                are stored by the daemon, so they are accepted for a `readonly`
                Library and for a path inside an archive.
            operationId: putEntryTags
            parameters:
                - $ref: "#/components/parameters/LibraryIdPath"
                - $ref: "#/components/parameters/PathQuery"
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/PutEntryTagsRequest"
            responses:
                "200":
                    description: The saved tags.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/EntryTagsResponse"
                "400":
                    $ref: "#/components/responses/InvalidRequest"
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "404":
                    $ref: "#/components/responses/NotFound"
                "500":
                    $ref: "#/components/responses/InternalServerError"
                "504":
                    $ref: "#/components/responses/GatewayTimeout"

    /libraries/{libraryId}/entries/folder-settings:
        put:
            tags:
                - Shelves
            summary: Save the settings of a folder
            description: |
                Saves the display values of the folder at `path`, replacing what it
                had. The folder is not looked up. The timeline Layout can be saved only in a Shelf.
            operationId: putFolderSetting
            parameters:
                - $ref: "#/components/parameters/LibraryIdPath"
                - $ref: "#/components/parameters/PathQuery"
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/FolderSettingRequest"
            responses:
                "200":
                    description: The saved settings.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/FolderSetting"
                "400":
                    $ref: "#/components/responses/InvalidRequest"
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "500":
                    $ref: "#/components/responses/InternalServerError"

        delete:
            tags:
                - Shelves
            summary: Remove the settings of a folder
            operationId: deleteFolderSetting
            parameters:
                - $ref: "#/components/parameters/LibraryIdPath"
                - $ref: "#/components/parameters/PathQuery"
            responses:
                "204":
                    description: The settings were removed.
                "400":
                    $ref: "#/components/responses/InvalidRequest"
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "404":
                    $ref: "#/components/responses/NotFound"
                "500":
                    $ref: "#/components/responses/InternalServerError"

    /tags/words:
        get:
            tags:
                - Ratings & Tags
            summary: List the words the current user has created
            description: |
                Returns every word the user has used on any entry, sorted. A word
                stays in the list after it is removed from the last entry that
                had it. Clients use the list to complete a word being typed.
            operationId: listTagWords
            responses:
                "200":
                    description: The words.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/TagsResponse"
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "500":
                    $ref: "#/components/responses/InternalServerError"

    /libraries/{libraryId}/uploads:
        post:
            tags:
                - Uploads
            summary: Create an upload session
            description: |
                Creates a resumable upload session for one file. The final
                size must be declared up front and is verified at commit.
                Chunks are staged as a hidden `.pxna-tmp-*` file in the
                target's own directory; the target path itself is only
                touched at commit time. With `conflict=fail`, an existing
                target is rejected both here and again at commit.

                Sessions expire 24 hours after creation and are held in
                memory only, so a daemon restart discards them.
            operationId: createUpload
            parameters:
                - $ref: "#/components/parameters/LibraryIdPath"
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/UploadCreateRequest"
            responses:
                "201":
                    description: Upload session created.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/UploadResponse"
                "400":
                    $ref: "#/components/responses/InvalidRequest"
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "403":
                    $ref: "#/components/responses/Forbidden"
                "404":
                    $ref: "#/components/responses/NotFound"
                "409":
                    $ref: "#/components/responses/Conflict"
                "500":
                    $ref: "#/components/responses/InternalServerError"
                "507":
                    $ref: "#/components/responses/InsufficientStorage"

    /libraries/{libraryId}/uploads/{uploadId}:
        get:
            tags:
                - Uploads
            summary: Get an upload session
            description: |
                Returns session state. An interrupted client reads
                `committedSize` here and resumes chunking from that offset.
            operationId: getUpload
            parameters:
                - $ref: "#/components/parameters/LibraryIdPath"
                - $ref: "#/components/parameters/UploadIdPath"
            responses:
                "200":
                    description: Upload session state.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/UploadResponse"
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "403":
                    $ref: "#/components/responses/Forbidden"
                "404":
                    $ref: "#/components/responses/NotFound"
                "500":
                    $ref: "#/components/responses/InternalServerError"
        delete:
            tags:
                - Uploads
            summary: Abort an upload session
            description: Discards the session and its staged bytes.
            operationId: deleteUpload
            parameters:
                - $ref: "#/components/parameters/LibraryIdPath"
                - $ref: "#/components/parameters/UploadIdPath"
            responses:
                "204":
                    description: Upload session discarded.
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "403":
                    $ref: "#/components/responses/Forbidden"
                "404":
                    $ref: "#/components/responses/NotFound"
                "500":
                    $ref: "#/components/responses/InternalServerError"

    /libraries/{libraryId}/uploads/{uploadId}/content:
        put:
            tags:
                - Uploads
            summary: Write an upload chunk
            description: |
                Appends one chunk of raw bytes at `offset`. The offset must
                equal the session's current `committedSize`; anything else
                returns `409` so an interrupted client first reads the
                session state and resumes from there.
            operationId: writeUploadContent
            parameters:
                - $ref: "#/components/parameters/LibraryIdPath"
                - $ref: "#/components/parameters/UploadIdPath"
                - $ref: "#/components/parameters/UploadOffsetQuery"
            requestBody:
                required: true
                content:
                    application/octet-stream:
                        schema:
                            type: string
                            format: binary
            responses:
                "204":
                    description: Chunk accepted.
                "400":
                    $ref: "#/components/responses/InvalidRequest"
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "403":
                    $ref: "#/components/responses/Forbidden"
                "404":
                    $ref: "#/components/responses/NotFound"
                "409":
                    $ref: "#/components/responses/Conflict"
                "500":
                    $ref: "#/components/responses/InternalServerError"
                "507":
                    $ref: "#/components/responses/InsufficientStorage"

    /libraries/{libraryId}/uploads/{uploadId}/commit:
        post:
            tags:
                - Uploads
            summary: Commit an upload session
            description: |
                Verifies that exactly `size` bytes were staged, then
                atomically publishes them to the target path using the
                conflict policy chosen at session creation. An incomplete
                session returns `400`.
            operationId: commitUpload
            parameters:
                - $ref: "#/components/parameters/LibraryIdPath"
                - $ref: "#/components/parameters/UploadIdPath"
            responses:
                "201":
                    description: File created at the target path.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/FileResponse"
                "400":
                    $ref: "#/components/responses/InvalidRequest"
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "403":
                    $ref: "#/components/responses/Forbidden"
                "404":
                    $ref: "#/components/responses/NotFound"
                "409":
                    $ref: "#/components/responses/Conflict"
                "500":
                    $ref: "#/components/responses/InternalServerError"

    /operations:
        get:
            tags:
                - Operations
            summary: List operations
            description: |
                Returns running operations and recently finished ones.
                Operations are held in memory only: a daemon restart clears
                them, and finished operations are pruned after about one
                hour.
            operationId: listOperations
            responses:
                "200":
                    description: Known operations.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/OperationList"
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "500":
                    $ref: "#/components/responses/InternalServerError"

    /operations/{operationId}:
        get:
            tags:
                - Operations
            summary: Get an operation
            operationId: getOperation
            parameters:
                - $ref: "#/components/parameters/OperationIdPath"
            responses:
                "200":
                    description: Operation state.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/OperationResponse"
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "404":
                    $ref: "#/components/responses/NotFound"
                "500":
                    $ref: "#/components/responses/InternalServerError"

    /operations/{operationId}/cancel:
        post:
            tags:
                - Operations
            summary: Cancel an operation
            description: |
                Requests cooperative cancellation. Entries already processed
                are not rolled back. Cancelling a finished operation, or a
                `timelineScan`, is a no-op that returns its current state.
            operationId: cancelOperation
            parameters:
                - $ref: "#/components/parameters/OperationIdPath"
            responses:
                "202":
                    description: Cancellation requested.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/OperationResponse"
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "404":
                    $ref: "#/components/responses/NotFound"
                "500":
                    $ref: "#/components/responses/InternalServerError"

    /libraries/{libraryId}/video/sessions:
        post:
            tags: [Media]
            summary: Start an HLS conversion session
            description: |
                Starts converting a video for playback. When the new session
                would exceed the daemon's limit on concurrent conversions, the
                oldest session is ended to make way; its requests then answer
                `410` with `SessionEvicted` until the session would have
                expired by idleness anyway, after which they answer `404`.
            operationId: createVideoSession
            parameters:
                - $ref: "#/components/parameters/LibraryIdPath"
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/VideoSessionCreateRequest"
            responses:
                "201":
                    description: Video session created.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/VideoSessionResponse"
                "400":
                    $ref: "#/components/responses/InvalidRequest"
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "403":
                    $ref: "#/components/responses/Forbidden"
                "404":
                    $ref: "#/components/responses/NotFound"
                "409":
                    $ref: "#/components/responses/Conflict"
                "500":
                    $ref: "#/components/responses/InternalServerError"
                "504":
                    $ref: "#/components/responses/GatewayTimeout"

    /libraries/{libraryId}/video/sessions/{sessionId}:
        delete:
            tags: [Media]
            summary: End an HLS conversion session
            description: |
                Ends the session and its conversion. A session the daemon ended
                to make way for a newer one answers `410` with
                `SessionEvicted`, like its playlist and segments.
            operationId: deleteVideoSession
            parameters:
                - $ref: "#/components/parameters/LibraryIdPath"
                - $ref: "#/components/parameters/VideoSessionIdPath"
            responses:
                "204":
                    description: Video session ended.
                "400":
                    $ref: "#/components/responses/InvalidRequest"
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "403":
                    $ref: "#/components/responses/Forbidden"
                "404":
                    $ref: "#/components/responses/NotFound"
                "409":
                    $ref: "#/components/responses/Conflict"
                "410":
                    $ref: "#/components/responses/SessionEvicted"
                "500":
                    $ref: "#/components/responses/InternalServerError"
                "504":
                    $ref: "#/components/responses/GatewayTimeout"

    /libraries/{libraryId}/video/sessions/{sessionId}/playlist.m3u8:
        get:
            tags: [Media]
            summary: Read the full VOD playlist
            operationId: getVideoPlaylist
            parameters:
                - $ref: "#/components/parameters/LibraryIdPath"
                - $ref: "#/components/parameters/VideoSessionIdPath"
            responses:
                "200":
                    description: VOD playlist.
                    content:
                        application/vnd.apple.mpegurl:
                            schema:
                                type: string
                "400":
                    $ref: "#/components/responses/InvalidRequest"
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "403":
                    $ref: "#/components/responses/Forbidden"
                "404":
                    $ref: "#/components/responses/NotFound"
                "409":
                    $ref: "#/components/responses/Conflict"
                "410":
                    $ref: "#/components/responses/SessionEvicted"
                "500":
                    $ref: "#/components/responses/InternalServerError"
                "504":
                    $ref: "#/components/responses/GatewayTimeout"

    /libraries/{libraryId}/video/sessions/{sessionId}/segments/{segmentName}:
        get:
            tags: [Media]
            summary: Read a completed transport stream segment
            operationId: getVideoSegment
            parameters:
                - $ref: "#/components/parameters/LibraryIdPath"
                - $ref: "#/components/parameters/VideoSessionIdPath"
                - $ref: "#/components/parameters/VideoSegmentNamePath"
            responses:
                "200":
                    description: MPEG transport stream segment.
                    content:
                        video/mp2t:
                            schema:
                                type: string
                                format: binary
                "400":
                    $ref: "#/components/responses/InvalidRequest"
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "403":
                    $ref: "#/components/responses/Forbidden"
                "404":
                    $ref: "#/components/responses/NotFound"
                "409":
                    $ref: "#/components/responses/Conflict"
                "410":
                    $ref: "#/components/responses/SessionEvicted"
                "500":
                    $ref: "#/components/responses/InternalServerError"
                "504":
                    $ref: "#/components/responses/GatewayTimeout"

components:
    securitySchemes:
        cookieAuth:
            type: apiKey
            in: cookie
            name: __Host-pxna_session
            description: |
                Browser session cookie. The server sets it with `Path=/`, `HttpOnly`,
                `Secure`, and `SameSite=Strict`. It is never exposed to JavaScript.
                When the daemon runs with `[web] insecure_cookie = true`, the cookie is named
                `pxna_session` and `Secure` is omitted.
        bearerAuth:
            type: http
            scheme: bearer
            bearerFormat: opaque-session-token
            description: |
                Opaque native-client session token. Native clients store it in a secure
                credential store and send it through the Authorization header. It is not a JWT.

    parameters:
        VideoSessionIdPath:
            name: sessionId
            in: path
            required: true
            schema:
                type: string
                minLength: 1
        VideoSegmentNamePath:
            name: segmentName
            in: path
            required: true
            schema:
                type: string
                pattern: '^[0-9]+\.ts$'

        ShelfIdPath:
            name: shelfId
            in: path
            required: true
            description: Identifier the daemon gave the Shelf.
            schema:
                type: string
                minLength: 1

        LibraryIdPath:
            name: libraryId
            in: path
            required: true
            description: Opaque identifier of a Library owned by the owner.
            schema:
                $ref: "#/components/schemas/LibraryId"

        TimelineLibraryIdsQuery:
            name: libraryIds
            in: query
            required: true
            description: |
                Libraries to list, repeated as `libraryIds=a&libraryIds=b`.
                Every id must name a Library; an unknown id is 404.
            style: form
            explode: true
            schema:
                type: array
                minItems: 1
                maxItems: 64
                items:
                    $ref: "#/components/schemas/LibraryId"

        PathQuery:
            name: path
            in: query
            required: true
            description: Path relative to the selected Library.
            schema:
                $ref: "#/components/schemas/RelativePath"
            example: /photos/2026

        IncludeHiddenQuery:
            name: includeHidden
            in: query
            required: false
            description: Whether hidden entries should be returned.
            schema:
                type: boolean
                default: false

        RangeHeader:
            name: Range
            in: header
            required: false
            description: |
                Single HTTP byte range as defined by RFC 7233, including suffix
                ranges such as `bytes=-500`. The daemon parses this header itself,
                so the schema intentionally carries no pattern.

                Multi-range requests such as `bytes=0-99,200-299` are not supported.
                The daemon ignores the header and returns a full `200` response in
                that case, as RFC 7233 permits. A well-formed but unsatisfiable
                range returns `416`.
            schema:
                type: string
            example: bytes=0-65535

        OffsetQuery:
            name: offset
            in: query
            required: false
            description: Byte offset used when `Range` is not supplied.
            schema:
                type: integer
                format: int64
                minimum: 0
                default: 0

        ReadLimitQuery:
            name: limit
            in: query
            required: false
            description: Maximum bytes in an explicit read window. Defaults to 1 MiB only when offset is supplied.
            schema:
                type: integer
                format: int64
                minimum: 1
                maximum: 134217728

        WriteConflictQuery:
            name: conflict
            in: query
            required: false
            description: |
                How to resolve an existing entry at the exact path. `rename` is
                not accepted; use `POST .../entries/files`.
            schema:
                $ref: "#/components/schemas/WriteConflictPolicy"

        ViewQuery:
            name: view
            in: query
            required: false
            description: |
                Which face of the path is meant: `file` or `folder`. Only an
                archive has both; without it, an archive is its file.
            schema:
                $ref: "#/components/schemas/EntryView"

        UploadIdPath:
            name: uploadId
            in: path
            required: true
            description: Opaque identifier of an upload session.
            schema:
                $ref: "#/components/schemas/UploadId"

        UploadOffsetQuery:
            name: offset
            in: query
            required: true
            description: |
                Byte offset of this chunk. Must equal the session's current
                `committedSize`.
            schema:
                type: integer
                format: int64
                minimum: 0

        OperationIdPath:
            name: operationId
            in: path
            required: true
            description: Opaque identifier of a long-running operation.
            schema:
                $ref: "#/components/schemas/OperationId"

    headers:
        SessionCookie:
            description: |
                Present only when `sessionTransport=cookie`. Production deployments
                must use HTTPS so the Secure cookie can be accepted by the browser.
            schema:
                type: string
            example: __Host-pxna_session=opaque-token; Path=/; HttpOnly; Secure; SameSite=Strict; Max-Age=2592000

        ClearedSessionCookie:
            description: Expired browser session cookie.
            schema:
                type: string
            example: __Host-pxna_session=; Path=/; HttpOnly; Secure; SameSite=Strict; Max-Age=0

        AcceptRanges:
            description: Indicates byte range support.
            schema:
                type: string
                enum:
                    - bytes

        ContentLength:
            description: Response body length in bytes.
            schema:
                type: integer
                format: int64
                minimum: 0

        ContentRange:
            description: Byte range returned in a partial response.
            schema:
                type: string
            example: bytes 0-65535/1048576

        ETag:
            description: Entity tag for cache validation.
            schema:
                type: string

    responses:
        InvalidRequest:
            description: |
                Invalid request. `code` is `InvalidRequest`, or
                `UnsupportedType` when the target cannot be opened as an
                archive, or `LimitExceeded` when an archive exceeds an entry,
                size, or nesting limit.
            content:
                application/problem+json:
                    schema:
                        $ref: "#/components/schemas/Problem"
                    example:
                        type: about:blank
                        title: Bad Request
                        status: 400
                        code: InvalidRequest
                        detail: Invalid request.
                        requestId: 0f8e2c4a9b6d4e1f8a3c5b7d9e1f2a4c

        Unauthorized:
            description: Missing or invalid authentication.
            content:
                application/problem+json:
                    schema:
                        $ref: "#/components/schemas/Problem"
                    example:
                        type: about:blank
                        title: Unauthorized
                        status: 401
                        code: Unauthorized
                        detail: Authentication is required.
                        requestId: 0f8e2c4a9b6d4e1f8a3c5b7d9e1f2a4c

        Forbidden:
            description: |
                The requested resource cannot be accessed or written. `code` is
                `Forbidden` for a `readonly` Library and for a mutation inside
                an archive, or `PasswordRequired` for a password-protected
                archive.
            content:
                application/problem+json:
                    schema:
                        $ref: "#/components/schemas/Problem"
                    example:
                        type: about:blank
                        title: Forbidden
                        status: 403
                        code: Forbidden
                        detail: Library access is not allowed.
                        requestId: 0f8e2c4a9b6d4e1f8a3c5b7d9e1f2a4c

        NotFound:
            description: Resource not found.
            content:
                application/problem+json:
                    schema:
                        $ref: "#/components/schemas/Problem"
                    example:
                        type: about:blank
                        title: Not Found
                        status: 404
                        code: NotFound
                        detail: Entry not found.
                        requestId: 0f8e2c4a9b6d4e1f8a3c5b7d9e1f2a4c

        SessionEvicted:
            description: |
                The video session was ended to make way for a newer one.
                `code` is `SessionEvicted`; an unknown or expired session is
                `404`.
            content:
                application/problem+json:
                    schema:
                        $ref: "#/components/schemas/Problem"
                    example:
                        type: about:blank
                        title: Gone
                        status: 410
                        code: SessionEvicted
                        detail: The video session was ended to make way for a newer one.
                        requestId: 0f8e2c4a9b6d4e1f8a3c5b7d9e1f2a4c

        AlreadyInitialized:
            description: The initial owner has already been registered.
            content:
                application/problem+json:
                    schema:
                        $ref: "#/components/schemas/Problem"
                    example:
                        type: about:blank
                        title: Conflict
                        status: 409
                        code: AlreadyInitialized
                        detail: Initial setup is already complete.
                        requestId: 0f8e2c4a9b6d4e1f8a3c5b7d9e1f2a4c

        RangeNotSatisfiable:
            description: Requested byte range cannot be satisfied.
            content:
                application/problem+json:
                    schema:
                        $ref: "#/components/schemas/Problem"
                    example:
                        type: about:blank
                        title: Range Not Satisfiable
                        status: 416
                        code: RangeNotSatisfiable
                        detail: Requested range is outside the file size.
                        requestId: 0f8e2c4a9b6d4e1f8a3c5b7d9e1f2a4c

        Conflict:
            description: |
                The request conflicts with the current state of the target.
                This also covers a source archive that changed while the
                daemon was reading it.
            content:
                application/problem+json:
                    schema:
                        $ref: "#/components/schemas/Problem"
                    example:
                        type: about:blank
                        title: Conflict
                        status: 409
                        code: Conflict
                        detail: Entry already exists.
                        requestId: 0f8e2c4a9b6d4e1f8a3c5b7d9e1f2a4c

        PayloadTooLarge:
            description: The request body exceeds the one-shot write limit.
            content:
                application/problem+json:
                    schema:
                        $ref: "#/components/schemas/Problem"
                    example:
                        type: about:blank
                        title: Payload Too Large
                        status: 413
                        code: PayloadTooLarge
                        detail: Body exceeds the 32 MiB one-shot limit.
                        requestId: 0f8e2c4a9b6d4e1f8a3c5b7d9e1f2a4c

        InsufficientStorage:
            description: The daemon does not have enough disk space.
            content:
                application/problem+json:
                    schema:
                        $ref: "#/components/schemas/Problem"
                    example:
                        type: about:blank
                        title: Insufficient Storage
                        status: 507
                        code: InsufficientStorage
                        detail: Not enough disk space.
                        requestId: 0f8e2c4a9b6d4e1f8a3c5b7d9e1f2a4c

        GatewayTimeout:
            description: Extraction or thumbnail generation timed out.
            content:
                application/problem+json:
                    schema:
                        $ref: "#/components/schemas/Problem"
                    example:
                        type: about:blank
                        title: Gateway Timeout
                        status: 504
                        code: Timeout
                        detail: Archive extraction timed out.
                        requestId: 0f8e2c4a9b6d4e1f8a3c5b7d9e1f2a4c

        InternalServerError:
            description: Internal server error.
            content:
                application/problem+json:
                    schema:
                        $ref: "#/components/schemas/Problem"
                    example:
                        type: about:blank
                        title: Internal Server Error
                        status: 500
                        code: InternalServerError
                        detail: Unexpected server error.
                        requestId: 0f8e2c4a9b6d4e1f8a3c5b7d9e1f2a4c

    schemas:
        MediaInfo:
            type: object
            description: |
                Media information of an image or a video. `kind` tells which
                one it is, and only the matching property (`image` or `video`)
                is present.
            required: [kind]
            properties:
                kind:
                    $ref: "#/components/schemas/MediaInfoKind"
                video:
                    $ref: "#/components/schemas/VideoMediaInfo"
                image:
                    $ref: "#/components/schemas/ImageMediaInfo"
        Preferences:
            type: object
            additionalProperties: false
            description: |
                Display preferences. `wide` and `narrow` are chosen by the
                width of the screen (768 CSS px); `sort`, `archiveOpen`, and
                `timelineLibraries` do not depend on it.
            required: [wide, narrow, sort]
            properties:
                wide:
                    $ref: "#/components/schemas/DisplaySet"
                narrow:
                    $ref: "#/components/schemas/DisplaySet"
                sort:
                    $ref: "#/components/schemas/SortPreference"
                archiveOpen:
                    $ref: "#/components/schemas/ArchiveOpen"
                timelineLibraries:
                    type: array
                    minItems: 1
                    maxItems: 64
                    description: |
                        Libraries the timeline shows. Absent means every
                        Library. Ids of Libraries that no longer exist are kept
                        as saved, and clients ignore them.
                    items:
                        $ref: "#/components/schemas/LibraryId"
        DisplayLayout:
            type: string
            description: How a listing is laid out.
            enum:
                - grid
                - list
                - timeline
        DisplayValueSet:
            type: object
            additionalProperties: false
            description: The values chosen by the width of the screen. An absent value is taken from the layer below.
            properties:
                view:
                    $ref: "#/components/schemas/DisplayLayout"
                tileSize:
                    type: integer
                    format: int32
                    minimum: 1
                    maximum: 5
                    description: Tile size step from 1 (smallest) to 5 (largest).
                thumbnailShape:
                    $ref: "#/components/schemas/ThumbnailShape"
        DisplayValues:
            type: object
            additionalProperties: false
            description: |
                The display values a Shelf or the settings of a folder hold, in
                the shape of the display preferences. Every value is optional.
            properties:
                wide:
                    $ref: "#/components/schemas/DisplayValueSet"
                narrow:
                    $ref: "#/components/schemas/DisplayValueSet"
                sort:
                    $ref: "#/components/schemas/SortPreference"
                archiveOpen:
                    $ref: "#/components/schemas/ArchiveOpen"
        ShelfInput:
            type: object
            additionalProperties: false
            required: [name, scope]
            properties:
                name:
                    type: string
                    description: 1 to 100 characters after surrounding whitespace is trimmed.
                scope:
                    $ref: "#/components/schemas/EntryScope"
                filter:
                    $ref: "#/components/schemas/EntryFilter"
                display:
                    $ref: "#/components/schemas/DisplayValues"
        Shelf:
            type: object
            additionalProperties: false
            description: |
                A saved Shelf. Its Scope and Filter can be sent to `listEntries`
                as they are. The path of each start is returned in normal form,
                with `.` and `..` resolved.
            required: [id, name, scope, filter, display]
            properties:
                id:
                    type: string
                name:
                    type: string
                scope:
                    $ref: "#/components/schemas/EntryScope"
                filter:
                    $ref: "#/components/schemas/EntryFilter"
                display:
                    $ref: "#/components/schemas/DisplayValues"
        ShelfList:
            type: object
            additionalProperties: false
            required: [shelves]
            properties:
                shelves:
                    type: array
                    items:
                        $ref: "#/components/schemas/Shelf"
        ShelfOrder:
            type: object
            additionalProperties: false
            required: [ids]
            properties:
                ids:
                    type: array
                    maxItems: 200
                    items:
                        type: string
        FolderSettingRequest:
            type: object
            additionalProperties: false
            description: The display values to save for the folder named in the query.
            required: [display]
            properties:
                display:
                    $ref: "#/components/schemas/DisplayValues"

        FolderSetting:
            type: object
            additionalProperties: false
            description: |
                The display values saved for one folder. The path is returned in
                normal form, with `.` and `..` resolved.
            required: [libraryId, path, display]
            properties:
                libraryId:
                    $ref: "#/components/schemas/LibraryId"
                path:
                    $ref: "#/components/schemas/RelativePath"
                display:
                    $ref: "#/components/schemas/DisplayValues"
        FolderSettingList:
            type: object
            additionalProperties: false
            required: [settings]
            properties:
                settings:
                    type: array
                    items:
                        $ref: "#/components/schemas/FolderSetting"
        DisplaySet:
            type: object
            additionalProperties: false
            required: [tileSize, thumbnailShape, view, originalImage, filmstripSize]
            properties:
                tileSize:
                    type: integer
                    format: int32
                    minimum: 1
                    maximum: 5
                    description: Tile size step from 1 (smallest) to 5 (largest).
                thumbnailShape:
                    $ref: "#/components/schemas/ThumbnailShape"
                view:
                    $ref: "#/components/schemas/ListView"
                originalImage:
                    $ref: "#/components/schemas/OriginalImageMode"
                filmstripSize:
                    type: integer
                    format: int32
                    minimum: 1
                    maximum: 5
                    description: |
                        Filmstrip size step of the viewer from 1 (smallest) to
                        5 (largest). Only the wide set uses it; the narrow set
                        keeps the value without showing a filmstrip.
        ThumbnailShape:
            type: string
            enum:
                - crop
                - fit
        ListView:
            type: string
            enum:
                - grid
                - list
        ArchiveOpen:
            type: string
            description: |
                How an archive opens: `folder` browses its contents like a
                folder, and `viewer` opens them in the viewer. An archive opens
                as a folder when the value is absent.
            enum:
                - folder
                - viewer
        OriginalImageMode:
            type: string
            description: |
                When a viewer swaps the display image for the original image.
                `auto` swaps automatically; `onZoom` swaps only when the user
                zooms in.
            enum:
                - auto
                - onZoom
        SortPreference:
            type: object
            additionalProperties: false
            required: [key, order]
            properties:
                key:
                    $ref: "#/components/schemas/SortKey"
                order:
                    $ref: "#/components/schemas/SortOrder"
        SortKey:
            type: string
            description: Same values as the `sort` query parameter.
            enum:
                - name
                - kind
                - size
                - modified_at
        SortOrder:
            type: string
            description: Same values as the `order` query parameter.
            enum:
                - asc
                - desc
        MediaInfoKind:
            type: string
            enum:
                - image
                - video
        VideoMediaInfo:
            type: object
            description: Container, codecs, duration and resolution of a video.
            required: [container, videoCodec, durationSecs, width, height, frameRate, contentType]
            properties:
                container:
                    type: string
                videoCodec:
                    type: string
                audioCodec:
                    type: string
                    nullable: true
                durationSecs:
                    type: number
                    format: double
                    minimum: 0
                width:
                    type: integer
                    format: int32
                    minimum: 0
                height:
                    type: integer
                    format: int32
                    minimum: 0
                frameRate:
                    type: number
                    format: double
                    minimum: 0
                contentType:
                    type: string
                    description: MIME type with codecs for HTMLMediaElement.canPlayType.
        ImageMediaInfo:
            type: object
            description: Format, size and shooting information of an image.
            required: [contentType, width, height, shooting]
            properties:
                contentType:
                    type: string
                    description: MIME type decided from the file extension.
                width:
                    type: integer
                    format: int32
                    minimum: 1
                    description: |
                        Width after applying the EXIF orientation. For formats whose
                        orientation is given by a rotation (HEIC, AVIF and so on), the
                        width as stored; apply `rotation` to get the displayed one.
                height:
                    type: integer
                    format: int32
                    minimum: 1
                    description: |
                        Height after applying the EXIF orientation. For formats whose
                        orientation is given by a rotation (HEIC, AVIF and so on), the
                        height as stored; apply `rotation` to get the displayed one.
                rotation:
                    type: integer
                    format: int32
                    minimum: 90
                    maximum: 270
                    description: |
                        Counterclockwise rotation in degrees (90, 180 or 270) that a
                        viewer applies to the stored image to display it upright. It is
                        not applied to `width` and `height`. Present only for formats
                        whose orientation is given by a rotation, when the image has one.
                shooting:
                    $ref: "#/components/schemas/ShootingInfo"
        ShootingInfo:
            type: object
            description: |
                Shooting information read from Exif. Every property is absent
                when the image has no Exif or the Exif does not carry it.
                Location is never returned.
            properties:
                takenAt:
                    type: string
                    description: |
                        Shooting time as `YYYY-MM-DDTHH:MM:SS` without a time zone.
                cameraMake:
                    type: string
                cameraModel:
                    type: string
                lensModel:
                    type: string
                focalLengthMm:
                    type: number
                    format: double
                fNumber:
                    type: number
                    format: double
                exposureTimeSecs:
                    type: number
                    format: double
                iso:
                    type: integer
                    format: int32
                    minimum: 0
        MediaInfoResponse:
            type: object
            required: [mediaInfo]
            properties:
                mediaInfo:
                    $ref: "#/components/schemas/MediaInfo"
        VideoSessionCreateRequest:
            type: object
            required: [path]
            properties:
                path:
                    $ref: "#/components/schemas/RelativePath"
        VideoSession:
            type: object
            required: [id, libraryId, path, playlistUrl, durationSecs]
            properties:
                id:
                    type: string
                libraryId:
                    $ref: "#/components/schemas/LibraryId"
                path:
                    $ref: "#/components/schemas/RelativePath"
                playlistUrl:
                    type: string
                durationSecs:
                    type: number
                    format: double
                    minimum: 0
        VideoSessionResponse:
            type: object
            required: [session]
            properties:
                session:
                    $ref: "#/components/schemas/VideoSession"

        HealthResponse:
            type: object
            required:
                - result
            properties:
                result:
                    type: boolean

        SetupStatus:
            type: object
            required:
                - initialized
            properties:
                initialized:
                    type: boolean
                    description: Whether the initial owner exists.

        InitialSetupRequest:
            type: object
            additionalProperties: false
            required:
                - username
                - password
                - sessionTransport
            properties:
                username:
                    $ref: "#/components/schemas/Username"
                password:
                    $ref: "#/components/schemas/Password"
                sessionTransport:
                    $ref: "#/components/schemas/SessionTransport"

        LoginRequest:
            type: object
            additionalProperties: false
            required:
                - username
                - password
                - sessionTransport
            properties:
                username:
                    $ref: "#/components/schemas/Username"
                password:
                    $ref: "#/components/schemas/Password"
                sessionTransport:
                    $ref: "#/components/schemas/SessionTransport"

        Username:
            type: string
            minLength: 1
            maxLength: 128
            pattern: ^[A-Za-z0-9._-]+$
            example: admin

        Password:
            type: string
            format: password
            writeOnly: true
            minLength: 8
            maxLength: 256

        SessionTransport:
            type: string
            description: How the client receives and sends the session credential.
            enum:
                - cookie
                - bearer
            default: cookie

        AuthResult:
            type: object
            required:
                - user
                - session
            properties:
                user:
                    $ref: "#/components/schemas/User"
                session:
                    $ref: "#/components/schemas/AuthSession"
                accessToken:
                    type: string
                    minLength: 1
                    description: |
                        Opaque token returned only for `sessionTransport=bearer`. Browser
                        cookie sessions omit this property.

        CurrentAuth:
            type: object
            required:
                - user
                - session
            properties:
                user:
                    $ref: "#/components/schemas/User"
                session:
                    $ref: "#/components/schemas/AuthSession"

        User:
            type: object
            required:
                - id
                - username
                - role
                - createdAt
                - updatedAt
            properties:
                id:
                    $ref: "#/components/schemas/UserId"
                username:
                    $ref: "#/components/schemas/Username"
                role:
                    $ref: "#/components/schemas/UserRole"
                createdAt:
                    type: string
                    format: date-time
                updatedAt:
                    type: string
                    format: date-time

        UserId:
            type: string
            minLength: 1
            description: Opaque daemon-issued user identifier.
            example: usr_01HZY3R0K8S9J2R0C3MSM6QGTV

        UserRole:
            type: string
            enum:
                - owner

        AuthSession:
            type: object
            required:
                - id
                - userId
                - status
                - transport
                - createdAt
                - expiresAt
            properties:
                id:
                    $ref: "#/components/schemas/SessionId"
                userId:
                    $ref: "#/components/schemas/UserId"
                status:
                    $ref: "#/components/schemas/SessionStatus"
                transport:
                    $ref: "#/components/schemas/SessionTransport"
                createdAt:
                    type: string
                    format: date-time
                expiresAt:
                    type: string
                    format: date-time
                lastSeenAt:
                    type: string
                    format: date-time
                    nullable: true

        SessionId:
            type: string
            minLength: 1
            description: Opaque daemon-issued session identifier.
            example: ses_01HZY3R0K8S9J2R0C3MSM6QGTV

        SessionStatus:
            type: string
            enum:
                - active
                - expired
                - revoked

        LibraryList:
            type: object
            required:
                - libraries
            properties:
                libraries:
                    type: array
                    items:
                        $ref: "#/components/schemas/Library"

        LibraryResponse:
            type: object
            required:
                - library
            properties:
                library:
                    $ref: "#/components/schemas/Library"

        Library:
            type: object
            required:
                - id
                - name
                - readonly
            properties:
                id:
                    $ref: "#/components/schemas/LibraryId"
                name:
                    type: string
                    minLength: 1
                    maxLength: 128
                    example: Photos
                readonly:
                    type: boolean

        LibraryId:
            type: string
            minLength: 1
            maxLength: 64
            pattern: ^[A-Za-z0-9._-]+$
            description: |
                Library identifier chosen by the operator in the daemon
                configuration file. Unlike the daemon-issued identifiers in
                this API it is a readable name, not a generated token. It is
                what the API uses in place of a host path, so the physical
                location of a Library is never exposed.

                Because the value is used as a URL path segment, the
                character set is restricted. The daemon rejects a
                configuration that violates it at startup.
            example: photos

        EntryResponse:
            type: object
            required:
                - entry
            properties:
                entry:
                    $ref: "#/components/schemas/FileSystemEntry"

        EntryView:
            type: string
            description: |
                The face of a path. `file` is the file, an archive file
                included; `folder` is a folder or an archive's root.
            enum:
                - file
                - folder

        FileResponse:
            type: object
            required:
                - file
            properties:
                file:
                    $ref: "#/components/schemas/FileSystemEntry"

        TimelineMonths:
            type: object
            required:
                - months
            properties:
                months:
                    type: array
                    items:
                        $ref: "#/components/schemas/TimelineMonth"

        TimelineMonth:
            type: object
            required:
                - month
                - count
            properties:
                month:
                    type: string
                    pattern: "^[0-9]{4}-[0-9]{2}$"
                    example: "2025-05"
                count:
                    type: integer
                    format: int64
                    minimum: 1

        TimelineStatuses:
            type: object
            required:
                - libraries
            properties:
                libraries:
                    type: array
                    items:
                        $ref: "#/components/schemas/TimelineStatus"

        TimelineStatus:
            type: object
            required:
                - libraryId
                - running
                - processedFiles
            properties:
                libraryId:
                    $ref: "#/components/schemas/LibraryId"
                running:
                    type: boolean
                    description: True while a full scan of the Library is running.
                processedFiles:
                    type: integer
                    format: int64
                    minimum: 0
                    description: Files and archive entries processed by the running scan.
                completedAt:
                    type: string
                    format: date-time
                    description: When the last full scan finished. Absent before the first one.

        TimelineScanRequest:
            type: object
            required:
                - libraryIds
            properties:
                libraryIds:
                    type: array
                    minItems: 1
                    maxItems: 64
                    items:
                        $ref: "#/components/schemas/LibraryId"

        LibraryPath:
            type: object
            description: |
                A place in a Library: a start of a Scope, an Entry, or a folder.
                A listing keeps the path of a start as it was given, so its
                response names a start by the path it was sent with. A saved
                Shelf and the folder settings return their paths in normal form.
            required:
                - libraryId
                - path
            properties:
                libraryId:
                    $ref: "#/components/schemas/LibraryId"
                path:
                    $ref: "#/components/schemas/RelativePath"

        EntryScope:
            type: object
            description: The starts of a listing and how far it reads from them.
            required:
                - starts
            properties:
                starts:
                    type: array
                    minItems: 1
                    maxItems: 64
                    items:
                        $ref: "#/components/schemas/LibraryPath"
                recursive:
                    type: boolean
                    description: Whether to include descendants below each start. Defaults to `false`.
                insideArchives:
                    type: boolean
                    description: |
                        Whether the Scope reads the archives found under its
                        starts like folders, down to the nesting limit. It
                        changes nothing without `recursive`.
                        Defaults to `false`.

        EntryFilter:
            type: object
            description: The conditions the Entries of a listing meet.
            properties:
                query:
                    type: string
                    description: |
                        Whitespace-separated terms that must all occur in an
                        entry name. Names and terms are normalized with NFKC and
                        converted to lowercase.
                rating:
                    type: string
                    description: |
                        Return only images and videos with this rating of the
                        current user. `none` selects the images and videos that
                        have not been rated. Folders and other files never match.
                    enum:
                        - good
                        - bad
                        - none
                tags:
                    type: array
                    maxItems: 32
                    description: |
                        Return only images and videos that have all of these
                        tags of the current user. Each word is trimmed like a tag
                        being set; a word the user has never used selects
                        nothing.
                    items:
                        $ref: "#/components/schemas/TagName"
                kinds:
                    type: array
                    maxItems: 5
                    description: Return only Entries of these kinds. A symbolic link is `other`.
                    items:
                        type: string
                        enum:
                            - folder
                            - archive
                            - image
                            - video
                            - other

        EntryListRequest:
            type: object
            required:
                - scope
            properties:
                scope:
                    $ref: "#/components/schemas/EntryScope"
                filter:
                    $ref: "#/components/schemas/EntryFilter"
                options:
                    $ref: "#/components/schemas/EntryListOptions"
                sort:
                    type: string
                    description: |
                        Sort key. `timeline_date` orders the images and videos by
                        their timeline dates, newest first only.
                        Defaults to `name`.
                    enum:
                        - name
                        - kind
                        - size
                        - modified_at
                        - timeline_date
                order:
                    type: string
                    description: Sort direction. Defaults to `asc`.
                    enum:
                        - asc
                        - desc
                page:
                    $ref: "#/components/schemas/EntryPageRequest"

        EntryListOptions:
            type: object
            additionalProperties: false
            properties:
                foldersFirst:
                    type: boolean
                    description: |
                        Place folders, and files whose `file.archive` hint is
                        true, before the other entries. `sort` and `order` apply
                        within each of the two groups.
                        Defaults to `false`.
                includeHidden:
                    type: boolean
                    description: |
                        Read the entries whose names start with `.` and the
                        entries inside them. A saved Shelf holds no options, so
                        it never reads them.
                        Defaults to `false`.
                fields:
                    type: string
                    description: |
                        `full` returns `items` with their Entries; `summary`
                        returns `summaries` for the direct children of one start.
                        Defaults to `full`.
                    enum:
                        - full
                        - summary

        EntryPageRequest:
            type: object
            additionalProperties: false
            required:
                - kind
            description: |
                Where the page starts. `kind` is `offset` for every sort except
                `timeline_date`, and `cursor` with it. An `offset` page takes
                `offset` or `locate`; a `cursor` page takes at most one of
                `after`, `before`, `month`, and `around`.
            properties:
                kind:
                    $ref: "#/components/schemas/EntryPageKind"
                limit:
                    type: integer
                    format: int32
                    minimum: 1
                    maximum: 1000
                    description: Defaults to `200`.
                offset:
                    type: integer
                    format: int64
                    minimum: 0
                    description: Defaults to `0`.
                locate:
                    allOf:
                        - $ref: "#/components/schemas/LibraryPath"
                    description: The Entry to find, named as a start is named. Not with `offset`.
                after:
                    type: string
                    description: A cursor from `next`; returns the Entries older than it.
                before:
                    type: string
                    description: A cursor from `previous`; returns the Entries newer than it.
                month:
                    type: string
                    pattern: "^[0-9]{4}-[0-9]{2}$"
                    description: |
                        Starts at the newest Entry of this month (`YYYY-MM`), or
                        of the next older month that has Entries.
                around:
                    allOf:
                        - $ref: "#/components/schemas/LibraryPath"
                    description: |
                        The Entry to start around, named as a start is named. The
                        page has it near its middle, and an Entry that is not in
                        the sequence is 404.

        EntryPageKind:
            type: string
            enum:
                - offset
                - cursor

        EntryMonthsRequest:
            type: object
            required:
                - scope
            properties:
                scope:
                    $ref: "#/components/schemas/EntryScope"
                filter:
                    $ref: "#/components/schemas/EntryFilter"

        ScopedEntry:
            type: object
            required:
                - libraryId
                - entry
            properties:
                libraryId:
                    $ref: "#/components/schemas/LibraryId"
                entry:
                    $ref: "#/components/schemas/FileSystemEntry"
                timelineDate:
                    type: string
                    description: |
                        Present with `sort=timeline_date`. Date the Entry is
                        ordered by, as `YYYY-MM-DDTHH:MM:SS` without a time zone,
                        in the daemon's configured time zone.
                timelineDateSource:
                    type: string
                    description: Present with `timelineDate`. Where it came from.
                    enum:
                        - exif
                        - creationTime
                        - modified
                        - archiveModified
                        - fileName

        EntryPage:
            type: object
            description: |
                One page of a listing. It carries `items` with `options.fields`
                of `full`, and `summaries` with `summary`.
            required:
                - page
                - warnings
            properties:
                items:
                    type: array
                    items:
                        $ref: "#/components/schemas/ScopedEntry"
                summaries:
                    type: array
                    items:
                        $ref: "#/components/schemas/ScopedEntrySummary"
                page:
                    $ref: "#/components/schemas/EntryPageInfo"
                warnings:
                    $ref: "#/components/schemas/EntryWarnings"

        ScopedEntrySummary:
            type: object
            required:
                - libraryId
                - summary
            properties:
                libraryId:
                    $ref: "#/components/schemas/LibraryId"
                summary:
                    $ref: "#/components/schemas/FileSystemEntrySummary"

        EntryPageInfo:
            type: object
            required:
                - kind
            description: |
                The effective page. An `offset` page carries `offset`,
                `totalCount`, and `snapshot`; a `cursor` page carries `previous`
                and `next`, each absent at an end.
            properties:
                kind:
                    $ref: "#/components/schemas/EntryPageKind"
                offset:
                    type: integer
                    format: int64
                    minimum: 0
                    description: Offset of this page in the merged sequence.
                totalCount:
                    type: integer
                    format: int64
                    minimum: 0
                    description: Number of Entries in the merged sequence after the Filter.
                snapshot:
                    type: string
                    description: |
                        Opaque identifier of the merged listing. It changes when
                        the listing of any start is rebuilt.
                previous:
                    type: string
                    description: Cursor for the page of newer Entries.
                next:
                    type: string
                    description: Cursor for the page of older Entries.

        EntryWarnings:
            type: object
            required:
                - cutOffStarts
                - walkedStarts
                - missingStarts
            properties:
                cutOffStarts:
                    type: array
                    description: Starts, as they were given, whose recursive traversal was cut off at the entry limit.
                    items:
                        $ref: "#/components/schemas/LibraryPath"
                walkedStarts:
                    type: array
                    description: |
                        Starts, as they were given, that the name index would
                        answer from a local folder but that were walked because
                        the index of their Library is not usable.
                    items:
                        $ref: "#/components/schemas/LibraryPath"
                missingStarts:
                    type: array
                    description: |
                        Starts, as they were given, that were skipped because
                        their folder or Library does not exist or they name a
                        file that is neither a folder nor an archive.
                    items:
                        $ref: "#/components/schemas/LibraryPath"

        Capabilities:
            type: object
            required: [summaryListing, entryDetails, childProbes, performanceLogging]
            properties:
                summaryListing:
                    type: boolean
                entryDetails:
                    type: boolean
                childProbes:
                    type: boolean
                performanceLogging:
                    type: boolean
                    description: Whether the daemon writes the performance log, so a client should send its timings to `/performance/client-timings`.

        ClientTimingReport:
            type: object
            required: [timings]
            properties:
                timings:
                    type: array
                    minItems: 1
                    maxItems: 200
                    items:
                        $ref: "#/components/schemas/ClientTiming"

        ClientTimingOperation:
            type: string
            description: |
                `display_image`, `original_image`, and `thumbnail_image` are the
                loads of those images. `viewer_display` is the time from moving
                the viewer to an entry until its display image is loaded.
                `video_start` is the time from opening a video player until the
                first frame is playing.
            enum:
                - display_image
                - original_image
                - thumbnail_image
                - video_start
                - viewer_display

        ClientTimingMode:
            type: string
            description: How a `video_start` plays the video. `direct` plays the original file, and the HLS modes play a converted session.
            enum:
                - direct
                - native-hls
                - hls-js

        ClientTiming:
            type: object
            description: |
                One timing in milliseconds. The phases come from the browser's
                Resource Timing and are omitted when the browser does not
                report them.
            required: [operation, durationMs]
            properties:
                operation:
                    $ref: "#/components/schemas/ClientTimingOperation"
                libraryId:
                    $ref: "#/components/schemas/LibraryId"
                path:
                    $ref: "#/components/schemas/RelativePath"
                durationMs:
                    type: number
                    minimum: 0
                    description: The whole time, from the start of the request or the move until the load.
                queuedMs:
                    type: number
                    minimum: 0
                    description: From the start of the request until the browser sent it.
                waitingMs:
                    type: number
                    minimum: 0
                    description: From sending the request until the first byte of the response.
                downloadMs:
                    type: number
                    minimum: 0
                    description: From the first byte until the last byte of the response.
                afterResponseMs:
                    type: number
                    minimum: 0
                    description: From the last byte until the load event, including decoding.
                bytes:
                    type: integer
                    format: int64
                    minimum: 0
                    description: The encoded body size.
                cached:
                    type: boolean
                    description: Whether the browser served the response from its cache.
                mode:
                    $ref: "#/components/schemas/ClientTimingMode"

        FileSystemEntrySummary:
            type: object
            required: [path, name, kind, archive]
            properties:
                path:
                    $ref: "#/components/schemas/RelativePath"
                name:
                    type: string
                    description: Last path segment.
                kind:
                    $ref: "#/components/schemas/FileSystemEntryKind"
                archive:
                    type: boolean
                    description: Extension-derived archive hint; false unless kind is file.

        EntryMetadataRequest:
            type: object
            additionalProperties: false
            required: [places]
            properties:
                places:
                    type: array
                    minItems: 1
                    maxItems: 200
                    items:
                        $ref: "#/components/schemas/LibraryPath"

        EntryMetadataList:
            type: object
            required: [items]
            properties:
                items:
                    type: array
                    items:
                        $ref: "#/components/schemas/EntryMetadataResult"

        EntryMetadataResult:
            type: object
            required: [libraryId, path]
            description: One place of the request, with either its Entry or its error kind.
            properties:
                libraryId:
                    $ref: "#/components/schemas/LibraryId"
                path:
                    $ref: "#/components/schemas/RelativePath"
                detail:
                    $ref: "#/components/schemas/FileSystemEntry"
                error:
                    $ref: "#/components/schemas/ErrorKind"

        FolderChildrenProbe:
            type: object
            required: [hasChildren, maxAgeMs]
            properties:
                maxAgeMs:
                    type: integer
                    format: int32
                    minimum: 0
                    maximum: 30000
                    description: Remaining validity; zero for unknown. Reused cache results do not receive a new lifetime.
                hasChildren:
                    type: boolean
                    nullable: true
                sourceVersion:
                    type: string
                    description: Opaque source version when it could be observed; absent if not known.

        FileSystemEntry:
            type: object
            required:
                - path
                - name
                - metadata
                - kind
            properties:
                path:
                    $ref: "#/components/schemas/RelativePath"
                name:
                    type: string
                    description: Last path segment.
                    example: IMG_0001.png
                metadata:
                    $ref: "#/components/schemas/FileSystemMetadata"
                kind:
                    $ref: "#/components/schemas/FileSystemEntryKind"
                file:
                    $ref: "#/components/schemas/FileSystemEntryFileDetail"
                folder:
                    $ref: "#/components/schemas/FileSystemEntryFolderDetail"
                link:
                    $ref: "#/components/schemas/FileSystemEntryLinkDetail"

        FileSystemMetadata:
            type: object
            required:
                - size
                - readonly
            properties:
                size:
                    type: integer
                    format: int64
                    minimum: 0
                    description: File size in bytes. Folders return 0 unless known.
                readonly:
                    type: boolean
                createdAt:
                    type: string
                    format: date-time
                    nullable: true
                modifiedAt:
                    type: string
                    format: date-time
                    nullable: true
                accessedAt:
                    type: string
                    format: date-time
                    nullable: true
                contentType:
                    type: string
                    nullable: true
                    example: image/png

        FileSystemEntryKind:
            type: string
            enum:
                - file
                - folder
                - link

        FileSystemEntryFileDetail:
            type: object
            nullable: true
            description: Present when `kind` is `file`.
            required:
                - archive
            properties:
                archive:
                    type: boolean
                    description: |
                        Whether the daemon expects to be able to list this
                        file's contents as a folder. This is a hint derived
                        from the extension alone; the daemon does not read the
                        file to answer a listing. Opening the archive may
                        still fail with `UnsupportedType`.

                        The set of recognised extensions is a server property,
                        so clients must not maintain their own list.

        FileSystemEntryFolderDetail:
            type: object
            nullable: true
            description: Present when `kind` is `folder`.
            properties:
                hasChildren:
                    type: boolean
                    nullable: true

        FileSystemEntryLinkDetail:
            type: object
            nullable: true
            description: Present when `kind` is `link`.
            properties:
                targetPath:
                    allOf:
                        - $ref: "#/components/schemas/RelativePath"
                    nullable: true
                    description: |
                        Link target, present only when it resolves to a path
                        inside the same Library. It is null for a broken link
                        and for a link pointing outside the Library, because
                        host absolute paths are never exposed.
                targetKind:
                    allOf:
                        - $ref: "#/components/schemas/FileSystemEntryKind"
                    nullable: true
                    description: |
                        Kind of the resolved target, so a client can choose an
                        icon without a second request. Null whenever
                        `targetPath` is null.

        RelativePath:
            type: string
            minLength: 1
            maxLength: 4096
            description: |
                Absolute-looking path within the selected Library. The resolved
                path must never escape that library.
            example: /photos/2026/IMG_0001.png

        RatingValue:
            type: string
            description: A rating. `none` means the entry has not been rated.
            enum:
                - good
                - bad
                - none

        RatingResponse:
            type: object
            required:
                - rating
            properties:
                rating:
                    $ref: "#/components/schemas/RatingValue"

        PutRatingRequest:
            type: object
            additionalProperties: false
            required:
                - rating
            properties:
                rating:
                    $ref: "#/components/schemas/RatingValue"

        TagName:
            type: string
            minLength: 1
            maxLength: 64
            description: |
                A tag word of 1 to 64 characters after trimming, without control
                characters. Upper and lower case are different words.
            example: trip

        EntryTagsResponse:
            type: object
            required:
                - tags
            properties:
                tags:
                    type: array
                    items:
                        $ref: "#/components/schemas/TagName"

        PutEntryTagsRequest:
            type: object
            additionalProperties: false
            required:
                - tags
            properties:
                tags:
                    type: array
                    maxItems: 32
                    items:
                        $ref: "#/components/schemas/TagName"

        TagsResponse:
            type: object
            required:
                - tags
            properties:
                tags:
                    type: array
                    items:
                        $ref: "#/components/schemas/TagName"

        WriteConflictPolicy:
            type: string
            description: |
                How a write to an exact path resolves an existing entry there:
                `fail` rejects with `409`, `skip` leaves it in place, and
                `overwrite` replaces it.
            enum:
                - fail
                - skip
                - overwrite
            default: fail

        ConflictPolicy:
            type: string
            description: |
                How to resolve an entry that already exists at the target
                path. `fail` rejects with `409`. `skip` leaves the existing
                entry untouched and reports the source as skipped.
                `overwrite` replaces the existing entry. `rename` writes
                under an alternative name, which is reported back in the
                result.
            enum:
                - fail
                - skip
                - overwrite
                - rename
            default: fail

        CreateFolderRequest:
            type: object
            additionalProperties: false
            required:
                - path
            properties:
                path:
                    $ref: "#/components/schemas/RelativePath"
                createParents:
                    type: boolean
                    default: false
                    description: Create missing intermediate folders as well.

        EntryRef:
            type: object
            additionalProperties: false
            description: |
                One Entry: its Library, its Library-relative path, and the face
                of the path. `view=folder` is a folder or an archive's root; any
                other value, or none, is the file, an archive file included.
            required:
                - libraryId
                - path
            properties:
                libraryId:
                    $ref: "#/components/schemas/LibraryId"
                path:
                    $ref: "#/components/schemas/RelativePath"
                view:
                    $ref: "#/components/schemas/EntryView"

        EntryDestination:
            type: object
            additionalProperties: false
            description: |
                Where a copy or move puts its sources: a Library and exactly
                one of `folderPath`, into which each source keeps its name, and
                `path`, the exact target of a single source, which is also how
                a rename is expressed. A destination is never inside an
                archive, so it has no `view`.
            required:
                - libraryId
            properties:
                libraryId:
                    $ref: "#/components/schemas/LibraryId"
                folderPath:
                    $ref: "#/components/schemas/RelativePath"
                path:
                    $ref: "#/components/schemas/RelativePath"

        EntryTransferRequest:
            type: object
            additionalProperties: false
            description: |
                Copy or move request. The sources are in one Library; the
                destination may be in another.
            required:
                - sources
                - destination
            properties:
                sources:
                    type: array
                    minItems: 1
                    maxItems: 1000
                    items:
                        $ref: "#/components/schemas/EntryRef"
                destination:
                    $ref: "#/components/schemas/EntryDestination"
                conflict:
                    $ref: "#/components/schemas/ConflictPolicy"

        EntryDeleteRequest:
            type: object
            additionalProperties: false
            description: |
                Delete request over Entries of one Library. `recursive`, false
                when omitted, deletes non-empty folders and everything below
                them.
            required:
                - targets
            properties:
                targets:
                    type: array
                    minItems: 1
                    maxItems: 1000
                    items:
                        $ref: "#/components/schemas/EntryRef"
                recursive:
                    type: boolean

        UploadCreateRequest:
            type: object
            additionalProperties: false
            required:
                - path
                - size
            properties:
                path:
                    $ref: "#/components/schemas/RelativePath"
                size:
                    type: integer
                    format: int64
                    minimum: 0
                    description: Final file size in bytes, verified at commit.
                conflict:
                    $ref: "#/components/schemas/ConflictPolicy"

        UploadResponse:
            type: object
            required:
                - upload
            properties:
                upload:
                    $ref: "#/components/schemas/Upload"

        Upload:
            type: object
            required:
                - id
                - path
                - size
                - committedSize
                - status
                - expiresAt
            properties:
                id:
                    $ref: "#/components/schemas/UploadId"
                path:
                    $ref: "#/components/schemas/RelativePath"
                size:
                    type: integer
                    format: int64
                    minimum: 0
                committedSize:
                    type: integer
                    format: int64
                    minimum: 0
                    description: Bytes accepted so far; the next chunk's `offset`.
                status:
                    $ref: "#/components/schemas/UploadStatus"
                expiresAt:
                    type: string
                    format: date-time

        UploadId:
            type: string
            minLength: 1
            description: Opaque daemon-issued upload session identifier.
            example: upl_01HZY3R0K8S9J2R0C3MSM6QGTV

        UploadStatus:
            type: string
            enum:
                - active
                - committed
                - aborted
                - expired

        OperationResponse:
            type: object
            required:
                - operation
            properties:
                operation:
                    $ref: "#/components/schemas/Operation"

        OperationList:
            type: object
            required:
                - operations
            properties:
                operations:
                    type: array
                    items:
                        $ref: "#/components/schemas/Operation"

        Operation:
            type: object
            required:
                - id
                - kind
                - status
                - libraryId
                - processedCount
                - skippedCount
                - failedEntries
                - createdAt
            properties:
                id:
                    $ref: "#/components/schemas/OperationId"
                kind:
                    $ref: "#/components/schemas/OperationKind"
                status:
                    $ref: "#/components/schemas/OperationStatus"
                libraryId:
                    $ref: "#/components/schemas/LibraryId"
                destinationLibraryId:
                    $ref: "#/components/schemas/LibraryId"
                resultEntries:
                    type: array
                    description: Successfully published top-level destinations, including names chosen by conflict=rename.
                    items:
                        $ref: "#/components/schemas/FileSystemEntry"
                processedCount:
                    type: integer
                    format: int64
                    minimum: 0
                totalCount:
                    type: integer
                    format: int64
                    minimum: 0
                    nullable: true
                    description: Total entries to process, when known up front.
                skippedCount:
                    type: integer
                    format: int64
                    minimum: 0
                    description: Entries left untouched by `conflict=skip`.
                failedEntries:
                    type: array
                    items:
                        $ref: "#/components/schemas/OperationFailure"
                createdAt:
                    type: string
                    format: date-time
                finishedAt:
                    type: string
                    format: date-time
                    nullable: true

        OperationId:
            type: string
            minLength: 1
            description: Opaque daemon-issued operation identifier.
            example: op_01HZY3R0K8S9J2R0C3MSM6QGTV

        OperationKind:
            type: string
            enum:
                - copy
                - move
                - delete
                - timelineScan

        OperationStatus:
            type: string
            enum:
                - pending
                - running
                - succeeded
                - failed
                - cancelled

        OperationFailure:
            type: object
            required:
                - path
                - kind
            properties:
                path:
                    $ref: "#/components/schemas/RelativePath"
                kind:
                    $ref: "#/components/schemas/ErrorKind"
                message:
                    type: string

        Problem:
            type: object
            description: |
                An RFC 9457 problem document. Every error response is one,
                served as `application/problem+json`, including a missing
                route, a method the route does not allow, a body that does not
                fit the contract, and a missing session. A body that does not
                fit the types of the contract is answered with status 422.
            required:
                - type
                - title
                - status
                - code
                - requestId
            properties:
                type:
                    type: string
                    description: Always `about:blank`; a client branches on `code`.
                title:
                    type: string
                    description: The reason phrase of `status`.
                status:
                    type: integer
                    format: int32
                code:
                    $ref: "#/components/schemas/ErrorKind"
                detail:
                    type: string
                    description: |
                        A message for a person. It never contains a host path,
                        and it is absent for an internal error.
                requestId:
                    type: string
                    description: |
                        Identifies this error. An internal error is logged
                        under it.

        ErrorKind:
            type: string
            description: |
                `UnsupportedType`, `LimitExceeded`, and `PasswordRequired`
                describe the target file rather than the request, so a client
                can tell "cannot open this format", "too large to handle", and
                "password protected" apart without parsing `detail`.
                `MethodNotAllowed` means that the path exists but does not
                accept the method.
                `Timeout` means that extracting an archive or generating a
                thumbnail did not finish within the daemon's time limit. The
                result is not cached, so repeating the same request can hit the
                same limit again; no `Retry-After` is returned.
                `SessionEvicted` means that the daemon ended a video session to
                make way for a newer one.
            enum:
                - InternalServerError
                - InvalidRequest
                - UnsupportedType
                - LimitExceeded
                - NotFound
                - Unauthorized
                - Forbidden
                - PasswordRequired
                - AlreadyInitialized
                - RangeNotSatisfiable
                - Conflict
                - PayloadTooLarge
                - InsufficientStorage
                - Timeout
                - MethodNotAllowed
                - SessionEvicted
