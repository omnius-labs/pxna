name: test-container

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
      - "release/*"
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "docker/**"
      - "compose.yaml"
      - "daemon/**"
      - "ui-web/**"
      - ".github/workflows/test-container.yml"
  pull_request:
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "docker/**"
      - "compose.yaml"
      - "daemon/**"
      - "ui-web/**"
      - ".github/workflows/test-container.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          platforms: linux/${{ matrix.arch }}
          tags: pxna:test
          build-args: PXNA_BUILD_VERSION=${{ github.sha }}
          cache-from: type=gha,scope=pxna-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=pxna-${{ matrix.arch }}

      - name: Smoke test
        run: bash docker/smoke.sh pxna:test

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish verified architecture
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          image=ghcr.io/${{ github.repository }}:${{ github.sha }}-${{ matrix.arch }}
          docker tag pxna:test "$image"
          docker push "$image"

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish multi-platform manifest
        run: |
          image=ghcr.io/${{ github.repository }}
          docker buildx imagetools create \
            --tag "$image:latest" --tag "$image:${{ github.sha }}" \
            "$image:${{ github.sha }}-amd64" "$image:${{ github.sha }}-arm64"
