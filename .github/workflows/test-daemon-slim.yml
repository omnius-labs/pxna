name: test-daemon-slim

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "daemon/**"
      - "!daemon/docs/**"
      - ".github/workflows/test-daemon-slim.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ./daemon

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Maximize build space
        uses: AdityaGarg8/remove-unwanted-software@v5
        with:
          remove-dotnet: true
          remove-android: true
          remove-haskell: true

      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: "recursive"

      - name: restore timestamps
        uses: chetan/git-restore-mtime-action@v2

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "20.1"
          directory: ${{ runner.temp }}/llvm

      - name: Setup rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Setup cargo make
        uses: davidB/rust-cargo-make@v1
        with:
          version: latest

      - name: Setup rust cache
        uses: Swatinem/rust-cache@v2.9.2
        with:
          shared-key: "ubuntu-latest-slim-lint"
          cache-on-failure: "true"
          cache-workspace-crates: "true"
          workspaces: |
            daemon -> target

      - name: Lint
        run: cargo make lint

  interface:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: "recursive"

      - name: Setup tools
        uses: jdx/mise-action@v5

      - name: Setup java
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Regenerate interface
        run: bash ./entrypoints/gen-interface.sh

      - name: Check generated interface is up to date
        run: |
          git status --porcelain -- entrypoints/interface
          test -z "$(git status --porcelain -- entrypoints/interface)"

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Maximize build space
        uses: AdityaGarg8/remove-unwanted-software@v5
        with:
          remove-dotnet: true
          remove-android: true
          remove-haskell: true

      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: "recursive"

      - name: restore timestamps
        uses: chetan/git-restore-mtime-action@v2

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "20.1"
          directory: ${{ runner.temp }}/llvm

      - name: Setup rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Setup cargo make
        uses: davidB/rust-cargo-make@v1
        with:
          version: latest

      - name: Install cargo nextest
        uses: taiki-e/install-action@nextest

      - name: Setup rust cache
        uses: Swatinem/rust-cache@v2.9.2
        with:
          shared-key: "ubuntu-latest-slim-test"
          cache-on-failure: "true"
          cache-workspace-crates: "true"
          workspaces: |
            daemon -> target

      - name: Install libheif and ffmpeg 9
        run: |
          sudo apt-get update
          sudo apt-get install -y libheif-examples libheif-plugin-libde265 libheif-plugin-dav1d
          curl -fsSL -o /tmp/ffmpeg.tar.xz "https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-09-30-13-08/ffmpeg-n9.0.2-17-g2a571b6068-linux64-gpl-9.0.tar.xz"
          echo "68ee646831adaae2495618346f3bba94ff207ff83bbd34d643e7004730d66269  /tmp/ffmpeg.tar.xz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/ffmpeg"
          tar -xJf /tmp/ffmpeg.tar.xz -C "$RUNNER_TEMP/ffmpeg" --strip-components=1
          echo "$RUNNER_TEMP/ffmpeg/bin" >> "$GITHUB_PATH"

      - name: Test
        env:
          PXNA_REQUIRE_FFMPEG: "1"
          PXNA_REQUIRE_HEIF_DEC: "1"
        run: cargo make test
