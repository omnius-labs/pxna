name: test-web

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
      - "release/*"
    paths:
      - "ui-web/**"
      - "mise.toml"
      - "mise.lock"
      - "daemon/openapi.yaml"
      - ".github/workflows/test-web.yml"
  pull_request:
    paths:
      - "ui-web/**"
      - "mise.toml"
      - "mise.lock"
      - "daemon/openapi.yaml"
      - ".github/workflows/test-web.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ./ui-web

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup tools
        uses: jdx/mise-action@v5

      - name: Cache npm
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('ui-web/package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Regenerate API types
        run: npm run gen:api

      - name: Check generated API types are up to date
        run: |
          git status --porcelain -- src/api
          test -z "$(git status --porcelain -- src/api)"
